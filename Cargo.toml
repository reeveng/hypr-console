[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package.console-repository]
opt-level = 2

[profile.dev.package.syn]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 2

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true

[workspace.metadata.dylint]
libraries = [{ path = "tools/explicit-rust", pattern = "explicit*" }]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values(any()))'] }

[workspace.lints.clippy]
single_match = "allow"
single_match_else = "allow"
match_bool = "allow"
equatable_if_let = "allow"
option_if_let_else = "allow"
manual_ok_err = "allow"
manual_let_else = "allow"
manual_unwrap_or = "allow"
manual_unwrap_or_default = "allow"

allow_attributes_without_reason = "deny"
rest_pat_in_fully_bound_structs = "deny"
fallible_impl_from = "deny"
iter_over_hash_type = "deny"
mixed_read_write_in_expression = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
debug_assert_with_mut_call = "deny"
significant_drop_in_scrutinee = "deny"
collection_is_never_read = "deny"
suspicious_operation_groupings = "deny"
empty_line_after_doc_comments = "deny"
empty_line_after_outer_attr = "deny"

default_numeric_fallback = "allow"
