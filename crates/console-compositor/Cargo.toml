[package]
name = "console-compositor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_compositor"
path = "src/lib.rs"

[[bin]]
name = "console-compositor"
path = "src/bin/console-compositor.rs"

[features]
color-transform = ["dep:console-wayland", "dep:wayland-scanner"]
lock-notify = ["dep:console-wayland", "dep:wayland-scanner"]
toplevel-mapping = [
  "dep:console-core-geometry",
  "dep:console-core-iteration",
  "dep:console-core-shapes",
  "dep:console-wayland",
  "dep:wayland-scanner",
]

[dependencies]
console-core-bounded-reads.workspace = true
console-core-color.workspace = true
console-core-external-programs.workspace = true
console-core-geometry = { workspace = true, optional = true }
console-core-iteration = { workspace = true, optional = true }
console-core-logging = { workspace = true, features = ["std"] }
console-core-places.workspace = true
console-core-size.workspace = true
console-core-never.workspace = true
console-core-number-conversion.workspace = true
console-core-screen-orientation.workspace = true
console-core-shapes = { workspace = true, optional = true }
console-core-text-encodings.workspace = true
console-core-words.workspace = true
console-operating-system-linux.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rustix = { workspace = true, features = ["net"] }
console-wayland = { path = "../console-wayland", optional = true }
wayland-scanner = { version = "0.31", optional = true }

[lints]
workspace = true

[dev-dependencies]
console-core-atomic-writes.workspace = true
console-core-temporary-directories.workspace = true
