# The confinement in console-.service.d/confining.conf, taken back off.
#
# The way back is the same `pkexec` as the way out, so this unit broke with
# console-controller and for one reason: the switcher records the session
# through a helper polkit lets this user run, and `NoNewPrivileges=` makes the
# kernel refuse the setuid bit that is still on the file. Held, the left Legion
# button would have recorded nothing and then stopped Game Mode, which brings
# Game Mode straight back. Nobody saw it, because getting there was already
# broken.
#
# `PrivateTmp=` is the second line this needs. Coming back asks Steam to go
# first, and `steam -shutdown` reaches the running Steam through a socket under
# /tmp -- a private one is an empty directory, so the ask would find nothing,
# say nothing, and leave Steam to be killed with its session. A Steam killed
# that way marks its installation unclean, and the next Game Mode start
# checksums every executable over the network before it draws anything. That is
# the argument in the switcher, undone from here.
#
# It has to be a drop-in rather than more lines in console-return.service, for
# the reason `console-controller.service.d/opening.conf` gives: a unit file is
# read before its drop-ins, so what that file already says about /dev/input
# stands only because `confining.conf` does not speak about it.

[Service]
NoNewPrivileges=no
ProtectSystem=no
PrivateTmp=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
