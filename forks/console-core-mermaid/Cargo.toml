default = ["all-diagrams", "svg", "layout-cytoscape", "layout-elk"]
system-clock = ["merman-model/system-clock", "merman-core/system-clock", "merman-render?/system-clock"]
system-timezone = ["merman-model/system-timezone", "merman-core/system-timezone", "merman-render?/system-timezone"]
system-random = ["merman-model/system-random", "merman-core/system-random", "merman-render?/system-random"]
system-timing = ["merman-model/system-timing", "merman-core/system-timing", "merman-render?/system-timing"]
presentation = ["merman-core/presentation", "dep:merman-markup"]
compat-json = ["presentation", "merman-core/compat-json"]
editor-facts = ["merman-core/editor-facts"]
svg = ["presentation", "dep:merman-render", "dep:merman-theme-contract"]
native-fonts = ["svg", "dep:merman-export", "merman-export/native-fonts"]
system-fonts = ["native-fonts", "merman-export/system-fonts"]
experimental-system-font-query = ["system-fonts", "merman-export/experimental-system-font-query"]
layout-cytoscape = ["svg", "merman-render/layout-cytoscape"]
layout-elk = ["svg", "merman-render/layout-elk"]
math = ["svg", "merman-render/math"]
# Convenience output/layout bundles; mathematical labels require explicit `math`.
complete-svg = ["svg", "layout-cytoscape"]
complete-svg-elk = ["complete-svg", "layout-elk"]
png = ["svg", "dep:merman-export", "merman-export/png"]
jpeg = ["svg", "dep:merman-export", "merman-export/jpeg"]
pdf = ["svg", "dep:merman-export", "merman-export/pdf"]
[dependencies]
merman-model = { package = "console-core-mermaid-model", path = "../console-core-mermaid-model", version = "=0.10.0-alpha.2", default-features = false, features = ["terminal-text"] }
merman-markup = { package = "console-core-mermaid-markup", path = "../console-core-mermaid-markup", version = "=0.10.0-alpha.2", default-features = false, optional = true, features = ["color"] }
merman-core = { package = "console-core-mermaid-syntax", path = "../console-core-mermaid-syntax", version = "=0.10.0-alpha.2", default-features = false }
merman-export = { package = "console-core-mermaid-export", path = "../console-core-mermaid-export", version = "=0.10.0-alpha.2", default-features = false, optional = true }
merman-render = { package = "console-core-mermaid-renderer", path = "../console-core-mermaid-renderer", version = "=0.10.0-alpha.2", default-features = false, optional = true }
merman-theme-contract = { package = "console-core-mermaid-theme-contract", path = "../console-core-mermaid-theme-contract", version = "=0.10.0-alpha.2", optional = true }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
data-encoding = "2.11.1"
base64 = "0.23.1"
criterion = "=0.8.2"
png = "0.18.1"
roxmltree = { package = "console-core-extensible-markup", path = "../../crates/console-core-extensible-markup" }
rustybuzz = "0.20.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
console-core-checksums = { path = "../../crates/console-core-checksums" }
usvg = { package = "console-core-scalable-vector-graphics", path = "../../crates/console-core-scalable-vector-graphics", default-features = false, features = ["system-fonts", "text"] }

