# Firefox names its profile directory after a random string it invents on
# first run, which is a directory nothing can be installed into ahead of time.
# Naming it here instead means the browser's colours arrive with everything
# else rather than having to be put on by hand after the first launch.

[Profile0]
Name=legion
IsRelative=1
Path=legion
Default=1

[General]
StartWithLastProfile=1
Version=2
