[package]
name = "console-nested-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_nested_desktop"
path = "src/lib.rs"

# Not a program on the device. It runs the device's desktop on a machine that
# is not the device, which is a thing only somebody working on it wants.
[[bin]]
name = "console-desktop"
path = "src/main.rs"

[dependencies]
console-external-programs.workspace = true
console-never.workspace = true
console-number-conversion.workspace = true
console-screen.workspace = true
console-test-stages.workspace = true
libc = "0.2"
serde_json = "1"

[lints]
workspace = true
