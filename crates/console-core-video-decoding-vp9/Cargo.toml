[package]
name = "console-core-video-decoding-vp9"
description = "Clean-room pure-Rust VP9 decoder (VP9 Bitstream & Decoding Process Specification)"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.95"
repository = "https://github.com/storytold/filmcraft"

[lib]
name = "console_core_video_decoding_vp9"
path = "src/lib.rs"

[features]
default = ["threads"]
threads = ["dep:console-concurrency"]

[dependencies]
console-core-api-compatibility.workspace = true
console-core-geometry.workspace = true
console-core-size.workspace = true
console-core-logging.workspace = true
console-core-never.workspace = true
console-core-number-conversion.workspace = true
console-core-pixel-buffers.workspace = true
console-core-video-interpolation.workspace = true
console-core-video-inverse-transforms.workspace = true
console-core-video-planes.workspace = true
console-core-boolean-decoding = { path = "../console-core-boolean-decoding" }
console-core-video-decoding-bitstream = { path = "../console-core-video-decoding-bitstream" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
console-concurrency = { workspace = true, optional = true }

[lints]
workspace = true
