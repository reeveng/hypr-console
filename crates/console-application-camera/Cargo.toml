[package]
name = "console-application-camera"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "console-application-camera"
path = "src/bin/console-camera.rs"
required-features = ["camera"]

[features]
default = ["camera"]
camera = [
  "dep:console-actor",
  "dep:console-core-color",
  "dep:console-core-fonts",
  "dep:console-core-iteration",
  "dep:console-core-number-conversion",
  "dep:console-core-png-files",
  "dep:console-core-state-machine",
  "dep:console-operating-system-linux",
  "dep:console-pictures",
  "dep:console-panel",
  "dep:console-program-lifetime",
  "dep:rustix",
]

[dependencies]
console-actor = { workspace = true, optional = true }
console-core-atomic-writes.workspace = true
console-core-color = { workspace = true, optional = true }
console-core-external-programs.workspace = true
console-core-fonts = { workspace = true, optional = true }
console-core-geometry.workspace = true
console-core-internal-programs.workspace = true
console-core-iteration = { workspace = true, optional = true }
console-core-logging = { workspace = true, features = ["std"] }
console-core-number-conversion = { workspace = true, optional = true }
console-core-places.workspace = true
console-core-png-files = { workspace = true, optional = true }
console-core-state-machine = { workspace = true, optional = true }
console-operating-system-linux = { workspace = true, optional = true }
console-panel = { workspace = true, optional = true }
console-pictures = { workspace = true, optional = true }
console-program-lifetime = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }

[dev-dependencies]
console-core-temporary-directories.workspace = true

[lints]
workspace = true
