[package]
name = "console-core-mermaid-markup"
version = "0.10.0-alpha.2"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/Latias94/merman"
repository = "https://github.com/Latias94/merman"
rust-version = "1.95"
description = "Shared Mermaid HTML safety, URL normalization, CSS structure, and color operations."
documentation = "https://docs.rs/merman-markup"
keywords = ["mermaid", "html", "sanitization", "css", "color"]
categories = ["text-processing", "web-programming", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
html = ["dep:html5ever", "dep:htmlize"]
url = ["dep:url", "dep:console-core-percent-decoding"]
color = ["dep:ryu-js"]

[dependencies]
merman-model = { package = "console-core-mermaid-model", path = "../console-core-mermaid-model", version = "=0.10.0-alpha.2", default-features = false }
serde_json = "1.0.154"
html5ever = { version = "0.40.1", optional = true }
htmlize = { version = "1.1.0", features = ["unescape"], optional = true }
url = { version = "2.5.8", optional = true }
console-core-percent-decoding = { path = "../../crates/console-core-percent-decoding", optional = true }
ryu-js = { version = "1.0.3", optional = true }

[lib]
name = "merman_markup"
