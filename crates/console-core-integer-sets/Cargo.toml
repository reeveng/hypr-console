[package]
name = "console-core-integer-sets"
version = "0.1.0"
autobenches = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ordered, invertible sets of unsigned integers."

[features]
default = ["std"]
std = []
font-types = ["dep:font-types"]
serde = ["dep:serde"]

[dependencies]
console-core-never.workspace = true
console-core-number-conversion = { path = "../console-core-number-conversion", default-features = false }
font-types = { package = "console-core-font-types", path = "../console-core-font-types", optional = true, default-features = false }
serde = { version = "1.0", features = ["derive", "alloc"], optional = true, default-features = false }

[dev-dependencies]
criterion.workspace = true
serde_json = "1.0"

[[bench]]
name = "int_set_benchmark"
harness = false

[[bench]]
name = "sparse_bit_set_benchmark"
harness = false

[lints]
workspace = true
