[package]
name = "console-repository"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_repository"
path = "src/lib.rs"


# A dev-machine tool like console-deploy, and deliberately not in [build]:
# renaming is something somebody does to this repository, never to the device.
[[bin]]
name = "console-rename"
path = "src/bin/console-rename.rs"

[dependencies]
console-core-atomic-writes.workspace = true
console-core-external-programs.workspace = true
console-core-never.workspace = true
console-program-contract.workspace = true
console-program-runtime.workspace = true

[lints]
workspace = true
