[metadata]
name = "Blossom"
about = "A pink dark theme for a handheld held at arm's length."
neutral_hue = 318

[color.night]
hue = 318
chroma = 0.018
lightness = 0.160
spent = "the deepest ground: the terminal, the picture behind everything, and the ink carried on top of a pastel fill"

[color.ground]
hue = 318
chroma = 0.024
lightness = 0.235
spent = "the bar, the strip a set of tabs sits in, and the space behind the keyboard"

[color.panel]
hue = 318
chroma = 0.030
lightness = 0.310
spent = "a window, a menu, a card, a key: whatever is in front of the wallpaper"

[color.fill]
hue = 342
chroma = 0.090
lightness = 0.500
least = { carries = ["text"], carries_ratio = 7.0, carries_lightness_contrast = 75.0 }
spent = "the length a notification is filled to: the volume, the brightness, the battery"

[color.edge]
hue = 318
chroma = 0.030
least = { on = ["ground", "panel"], ratio = 3.0, lightness_contrast = 30.0 }
lightness = 0.480
spent = "a line between two things. It is not read, so it clears the 3:1 an edge needs and no more"

[color.ash]
hue = 330
chroma = 0.062
least = { on = ["night"], ratio = 4.5, lightness_contrast = 45.0 }
lightness = 0.560
spent = "what a terminal means by black. A program that prints in it is asking for something quiet, and this is as quiet as a thing may be and still be read"

[color.text]
hue = 335
chroma = 0.022
least = { on = ["panel", "ground", "night"], ratio = 10.0, lightness_contrast = 90.0 }
lightness = 0.860
spent = "everything that is read"

[color.soft]
hue = 332
chroma = 0.038
least = { on = ["panel", "ground", "night"], ratio = 7.0, lightness_contrast = 75.0 }
lightness = 0.760
spent = "what is beside the thing being read: a shortcut, a unit, a workspace you are not on"

[color.pink]
hue = 342
chroma = 0.105
lightness = 0.855
least = { on = ["panel", "ground", "night"], ratio = 7.0, lightness_contrast = 75.0, carries = ["night"], carries_ratio = 7.0, carries_lightness_contrast = 75.0 }
spent = "this one: the workspace you are on, the highlighted row, the key under your thumb, the window you are typing into"

[color.rose]
