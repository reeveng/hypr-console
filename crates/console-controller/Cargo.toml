[package]
name = "console-controller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_controller"
path = "src/lib.rs"

[[bin]]
name = "stick-scroll"
path = "src/bin/stick-scroll.rs"

[[bin]]
name = "game-return"
path = "src/bin/game-return.rs"

# The last shell script that was the daemon's. It is a program of its own and
# not a word this daemon takes, because the unit loads the profile before the
# daemon has read anything and Game Mode loads the other one when the daemon is
# not running at all.
[[bin]]
name = "controller-profile"
path = "src/bin/controller-profile.rs"

[dependencies]
console-child-processes.workspace = true
console-external-programs.workspace = true
console-number-conversion.workspace = true
console-wait-times.workspace = true
console-cpu-boost.workspace = true
console-onscreen.workspace = true
console-gamepad.workspace = true
# What a program is, and the loop that carries out what one decided.
# `controller-profile` is the first program here written to it.
console-program-contract.workspace = true
console-program-runtime.workspace = true
console-never.workspace = true
serde_json = "1"
evdev = "0.13"
libc = "0.2"

# The harness builds a pad out of the profiles in the checkout, which the daemon
# itself never does: it is handed one. So `read` is asked for here rather than
# above, and `stick-scroll` compiles no YAML parser.
[dev-dependencies]
console-gamepad = { workspace = true, features = ["read"] }

[lints]
workspace = true
