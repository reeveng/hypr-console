[package]
name = "console-core-state-machine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = ["dep:console-core-bytes", "dep:console-core-checksums", "dep:console-core-number-conversion"]

[dependencies]
console-core-bytes = { workspace = true, features = ["alloc"], optional = true }
console-core-checksums = { workspace = true, optional = true }
console-core-never.workspace = true
console-core-number-conversion = { path = "../console-core-number-conversion", default-features = false, optional = true }

[lints]
workspace = true
