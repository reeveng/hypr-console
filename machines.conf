# What is true on one machine and not on the others.
#
# desktop.conf is this desktop, on whatever it is installed on. This file is the
# exceptions, and most machines match nothing in it: what they get is
# desktop.conf and nothing else, which is the point of this file staying short.
# A laptop does not need a block here to be installed on, and if it ever does,
# that is a fault in what the code asks the machine rather than a line to add.
#
# A machine is named by what its firmware calls itself. `matches` is read
# against product_name and product_family under /sys/class/dmi/id, case folded,
# and a part of the name is enough. That is the same question omarchy's
# `omarchy-hw-match` asks in front of each of its hardware fixes, the same one
# InputPlumber's device files ask in their dmi_data block, and the same one
# systemd's hwdb and the kernel's own panel orientation quirks are keyed on. Four
# answers already agree on where this fact lives.
#
# Everything under a machine's headings is the manifest's own vocabulary, read by
# the same code and laid down by the same apply, after desktop.conf and in the
# same order. A line may not be in both: a block says what is true on one
# machine, so a name in both is one of the two being wrong, and
# `console-manifest-engine` refuses it.
#
# What must never arrive here: a condition, a default, a value worked out from
# another value. A block is selected or it is not. The moment this file can
# compute, a machine stops being something anybody can read as a description of
# itself.

[legion-go]
matches = Legion Go

[legion-go.packages]
# The two packages a plain Arch machine cannot be handed.
#
# Both are in this machine's repositories and in no repository anything else
# here can count on: pamac is Manjaro's, carried by cachyos, and freetube is an
# AUR build. An apply hands every missing name to pacman in one command, so one
# name nothing carries is not one package missing -- it is "target not found"
# and an apply that stops before it has written a file.
#
# That is the whole reason they are here, and it is a reason about the machine's
# repositories rather than about the machine. The right answer is an origin
# beside the name, the way a file can be marked `theirs`, and then a machine
# with no way to reach that origin says which package it cannot have instead of
# failing at the first one. todos.md carries that and the other half of it,
# which is that what one person has installed has never been separable from
# what this desktop needs.
#
# What is lost where they are not installed: the Add/Remove Software entry in
# the menu opens nothing, and there is no FreeTube. The flatpak half of the shop
# is still there, which is where most of what anybody asks for by name lives
# anyway.
pamac-aur
freetube

[legion-go.files]
# The controller. This is the shipped device definition, edited: a copy in
# devices.d does not replace it, it is loaded as well, and the two together
# claim the same hardware twice. A package update will put the original back,
# which `console check` reports as a difference like any other.
#
# It is here and not in desktop.conf because it is this handheld by name --
# `dmi_data: product_name: 83E1` is in the file itself. InputPlumber ships
# definitions for the pads it knows, so a pad plugged into any other machine is
# claimed by one of theirs and wants nothing from this tree.
#
# One of the two profiles is here and the other is not. The router, which the
# desktop wears from login to shutdown, is written by `console buttons` out of
# what the pad in front of it says it can send, so it is never a file any
# machine gets. game.yaml is what the pad wears when Steam has the screen: a
# pad, untouched, which is what a game expects, and it translates nothing.
#
# There were two more, loaded while the on-screen keyboard was up and while the
# card that asks which button you pressed was up. Both are gone: each was one
# program taking the front of the machine, said through a file any program can
# write, and it is asked of the kernel now. See `console_input_claim`.
/usr/share/inputplumber/devices/50-legion_go.yaml
/etc/inputplumber/profiles/game.yaml

# The pad's buzz is the one thing a profile changes that InputPlumber has no
# hand in: the controller ticks its own motors in firmware as a thumb moves
# across the touchpad. The rule turns that off when the controller appears and
# hands the file to this user, so `controller-profile` can put it back for game.
# It matches on `hid-lenovo-go`, so it is this machine's by construction.
/etc/udev/rules.d/92-console-haptics.rules

# The pad's touchpad, which is an ordinary input device owned by root, handed to
# the person logged in because logind will not do it for this one. The rule
# matches the controller by name.
/etc/udev/rules.d/91-console-touchpad.rules

# Nothing on this machine animates, and the fourth thing that had to be told so
# was the boot splash, which lives in the initramfs hooks. An initramfs belongs
# to whatever put the machine together: on a machine where this desktop is the
# whole of what is installed, that is this tree, and on a machine where it is a
# session beside another desktop it is emphatically not.
/etc/mkinitcpio.conf

# The session: which one logs in, and the way to the Steam one and back. The
# drop-in is also what starts the one service that runs in Game Mode, which is
# the button that comes back.
#
# `steamos-session-select` rewrites the autologin file on the way into Game Mode
# and again on the way back, so what is in it is a report of where somebody went
# last and never a difference worth a card. What this ships is where a machine
# with no answer yet starts.
#
# Every one of these names something only a handheld running cachyos-handheld
# has: plasmalogin, a gamescope session, and a Steam that has a Game Mode to
# cross to. On a machine with none of them an apply would lay down four files
# under directories nothing reads.
/etc/plasmalogin.conf.d/zz-steamos-autologin.conf theirs
/etc/systemd/user/gamescope-session.service.d/console.conf
/usr/local/bin/steamos-session-select
/etc/systemd/user/console-return.service
/etc/systemd/user/console-return.service.d/opening.conf

# What keeps SteamOS from repairing an installation that is not broken.
# steam-short-session-tracker reads it, and nothing reads what is in it.
/home/@user@/.config/inhibit-short-session-tracker

# The look, in the directories other programs own.
#
# Every other file this desktop writes is in a directory it can name: its own
# `.config/console`, `/usr/local`, a unit of its own. These six cannot be named.
# GTK reads `gtk-4.0/gtk.css` and `gtk-4.0/settings.ini` under the config home
# and nowhere else, Qt reads `kdeglobals`, and alacritty reads
# `alacritty/alacritty.toml`; none of them takes a directory from this desktop,
# and the compositor's trick of moving the config home cannot be used for these
# because `.config/console` is under the config home and moving it takes the
# palette with it.
#
# So they are what is true on a machine this desktop is the whole of. There, a
# person's GTK and Qt applications wearing this palette is the desktop being
# finished rather than the desktop reaching: the menu, the settings and the
# guide are drawn from `console-panel`'s own stylesheet either way, and these
# are what make pamac and a print dialogue agree with them. On a machine where
# this is a session beside another desktop, the other one wrote these first and
# the person chose it.
#
# The numbers in them say the same thing. `gtk-xft-dpi` and every font size is
# the handheld's panel at arm's length, which is not a laptop's, so a machine
# that took these would be wearing another machine's density.
/home/@user@/.config/alacritty/alacritty.toml
/home/@user@/.config/gtk-3.0/gtk.css
/home/@user@/.config/gtk-3.0/settings.ini
/home/@user@/.config/gtk-4.0/gtk.css
/home/@user@/.config/gtk-4.0/settings.ini
/home/@user@/.config/kdeglobals

# Which browser a link means, as this desktop ships. The settings panel writes
# her own ~/.config/mimeapps.list over it, which is why this one is under /etc:
# a choice the panel makes has to be able to win, and a manifest that owned
# both would report her choice as drift. It is the machine's because /etc/xdg is
# every session's: a default handler laid down here is the answer for the other
# desktop on the machine as well, and nobody asked this one what a link means
# over there.
/etc/xdg/mimeapps.list

# Which profile the browser opens, and the one file in this tree that can lose
# somebody something. A Firefox-family profiles.ini is the list of every profile
# a person has, and this one declares the `console` profile and marks it the
# default -- so an apply on a machine with a browser somebody already uses
# replaces that list with a list of one, and what they see is a browser that has
# forgotten them. Their profile directories are still there, which is not what
# it looks like from the front.
#
# The profile itself stays in desktop.conf: `.librewolf/console` is a directory
# of this desktop's own, and installing it costs nothing on a machine that never
# opens it. What is missing on such a machine is anything to select it, because
# the browser is started through its own package's .desktop entry and chooses by
# this file. todos.md has what that wants instead, which is `--profile` and the
# end of MOZ_LEGACY_PROFILES with it.
/home/@user@/.librewolf/profiles.ini

[legion-go.masked]
# This unit rewrites the autologin setting back to Game Mode on every logout,
# which is how the machine kept arriving back at a session nobody chose. It is
# cachyos-handheld's, so there is nothing to mask anywhere else.
cachyos-gamescope-autologin.service
