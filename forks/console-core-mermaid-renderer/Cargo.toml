[package]
name = "console-core-mermaid-renderer"
version = "0.10.0-alpha.2"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/Latias94/merman"
repository = "https://github.com/Latias94/merman"
rust-version = "1.95"
description = "Headless layout + SVG renderer for Mermaid (parity-focused; upstream SVG goldens)."
documentation = "https://docs.rs/merman-render"
keywords = ["mermaid", "diagrams", "svg", "layout", "headless"]
categories = ["visualization"]
exclude = [
  "examples/*_debug_svg.rs",
  "examples/ratex_math_audit.rs",
  "tests/**",
]

[package.metadata.merman]
artifact-profile-required = true
fixed-capabilities = ["svg"]
wasm-inputs = ["assets/zenuml"]

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-model/diagram-architecture"]
diagram-block = ["merman-model/diagram-block"]
diagram-c4 = ["merman-model/diagram-c4"]
diagram-class = ["merman-model/diagram-class"]
diagram-cynefin = ["merman-model/diagram-cynefin"]
diagram-er = ["merman-model/diagram-er"]
diagram-event-modeling = ["merman-model/diagram-event-modeling"]
diagram-agentflow = ["merman-model/diagram-agentflow"]
diagram-usecase = ["merman-model/diagram-usecase"]
diagram-flowchart = ["merman-model/diagram-flowchart"]
diagram-gantt = ["merman-model/diagram-gantt"]
diagram-git-graph = ["merman-model/diagram-git-graph"]
diagram-info = ["merman-model/diagram-info"]
diagram-ishikawa = ["merman-model/diagram-ishikawa"]
diagram-journey = ["merman-model/diagram-journey"]
diagram-kanban = ["merman-model/diagram-kanban"]
diagram-mindmap = ["merman-model/diagram-mindmap"]
diagram-packet = ["merman-model/diagram-packet"]
diagram-pie = ["merman-model/diagram-pie"]
diagram-quadrant-chart = ["merman-model/diagram-quadrant-chart"]
diagram-radar = ["merman-model/diagram-radar"]
diagram-railroad = ["merman-model/diagram-railroad"]
diagram-requirement = ["merman-model/diagram-requirement"]
diagram-sankey = ["merman-model/diagram-sankey"]
diagram-sequence = ["merman-model/diagram-sequence"]
diagram-state = ["merman-model/diagram-state"]
diagram-swimlane = ["merman-model/diagram-swimlane"]
diagram-timeline = ["merman-model/diagram-timeline"]
diagram-tree-view = ["merman-model/diagram-tree-view"]
diagram-treemap = ["merman-model/diagram-treemap"]
diagram-venn = ["merman-model/diagram-venn"]
diagram-wardley = ["merman-model/diagram-wardley"]
diagram-xychart = ["merman-model/diagram-xychart"]
diagram-zenuml = ["merman-model/diagram-zenuml", "cssparser/fast_match_color"]
default = []
system-clock = ["merman-model/system-clock"]
system-timezone = ["merman-model/system-timezone"]
system-random = ["merman-model/system-random"]
system-timing = ["merman-model/system-timing"]
layout-cytoscape = ["dep:manatee"]
math = [
  "dep:ratex-font",
  "dep:ratex-layout",
  "dep:ratex-parser",
  "dep:ratex-svg",
  "dep:ratex-types",
  "ratex-svg/embed-fonts",
]

[dependencies]
console-core-line = { path = "../../crates/console-core-line" }
console-core-point = { path = "../../crates/console-core-point" }
merman-markup = { package = "console-core-mermaid-markup", path = "../console-core-mermaid-markup", version = "=0.10.0-alpha.2", default-features = false, features = ["html", "url", "color"] }
merman-model = { package = "console-core-mermaid-model", path = "../console-core-mermaid-model", version = "=0.10.0-alpha.2", default-features = false, features = ["presentation-data", "compat-json", "html-entities"] }
data-encoding = "2.11.1"
base64 = "0.23.1"
cssparser = { version = "0.38.0", default-features = false, features = ["fast_match_byte"] }
data-url = { package = "console-core-urls", path = "../../crates/console-core-urls" }
dugong = { package = "console-core-mermaid-dagre", path = "../console-core-mermaid-dagre", version = "=0.10.0-alpha.2" }
euclid = "0.22.14"
indexmap = { version = "2.14.2", features = ["serde"] }
kurbo = { package = "console-core-curve-geometry", path = "../console-core-curve-geometry" }
libm = { version = "=0.2.16", default-features = false }
manatee = { package = "console-core-mermaid-cytoscape", path = "../console-core-mermaid-cytoscape", version = "=0.10.0-alpha.2", optional = true }
memchr = "2"
merman-theme-contract = { package = "console-core-mermaid-theme-contract", path = "../console-core-mermaid-theme-contract", version = "=0.10.0-alpha.2" }
console-core-markdown = { path = "../console-core-markdown" }
ratex-font = { version = "0.1.15", optional = true }
ratex-layout = { version = "0.1.15", optional = true }
ratex-parser = { version = "0.1.15", optional = true }
ratex-svg = { version = "0.1.15", default-features = false, optional = true }
ratex-types = { version = "0.1.15", optional = true }
console-core-perfect-hash = { path = "../../crates/console-core-perfect-hash", features = ["std"] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svgtypes = { package = "console-core-scalable-vector-graphics-values", path = "../../crates/console-core-scalable-vector-graphics-values" }
thiserror = "2.0.21"
roughr = { package = "console-core-mermaid-sketches", path = "../console-core-mermaid-sketches", version = "0.12.6", default-features = false }
ryu-js = "1.0.3"
unicode-width = { version = "0.2.3", default-features = false }
unicode-linebreak = { package = "console-core-line-breaking", path = "../../crates/console-core-line-breaking", version = "=0.1.5" }
unicode-segmentation = { package = "console-core-text-boundaries", path = "../../crates/console-core-text-boundaries", version = "1.13.3", default-features = false }

[dev-dependencies]
roxmltree = { package = "console-core-extensible-markup", path = "../../crates/console-core-extensible-markup" }
# Browser geometry replays require the exact captured IEEE-754 values.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
merman-core = { package = "console-core-mermaid-syntax", path = "../console-core-mermaid-syntax", version = "=0.10.0-alpha.2", default-features = false, features = ["all-diagrams", "presentation", "compat-json", "test-support"] }
regex = "1.13.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(merman_internal_theme_acceptance)'] }

[lib]
name = "merman_render"

[dependencies.console-core-checksums]
path = "../../crates/console-core-checksums"
