[package]
name = "console-core-video-decoding-high-efficiency-video-coding"
description = "Clean-room pure-Rust H.265/HEVC decoder (ITU-T H.265)"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.95"
repository = "https://github.com/storytold/filmcraft"

[lib]
name = "console_core_video_decoding_high_efficiency_video_coding"
path = "src/lib.rs"

[features]
default = ["threads"]
threads = ["dep:console-concurrency"]

[dependencies]
console-core-api-compatibility.workspace = true
console-core-geometry.workspace = true
console-core-never.workspace = true
console-core-number-conversion.workspace = true
console-core-pixel-buffers.workspace = true
console-core-video-planes.workspace = true
console-core-adaptive-arithmetic-decoding = { path = "../console-core-adaptive-arithmetic-decoding" }
console-core-video-decoding-bitstream = { path = "../console-core-video-decoding-bitstream" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
console-concurrency = { workspace = true, optional = true }

[lints]
workspace = true
