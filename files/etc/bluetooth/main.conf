# Bluetooth, as this machine wants it.
#
# Short on purpose. bluez compiles in a default for everything it is not told,
# and the file it ships is four hundred lines of those defaults written out as
# comments, which goes stale the day bluez changes one of them. What is here is
# what this desktop decides and nothing else.

[General]
# Nothing pairs with this machine unless somebody here is pairing it.
#
# bluez makes the radio pairable while an agent is registered, and for good if
# this is true. The only agent this desktop registers is the one a press on the
# Bluetooth tab starts, for exactly as long as that pairing lasts, and it lets
# in the one device it was pressed for and turns everything else away. With
# this false, a device that asks to pair on its own is refused without anybody
# being asked. It is bluez's default, and it is written down because it is a
# decision this desktop made rather than one it happened to inherit.
AlwaysPairable = false

# A device that is already paired may not quietly pair again.
#
# Pairing again without asking is how something that has learned a paired
# device's address takes its place: the keys are replaced, and the stranger is
# let in as the thing it claims to be. bluez can allow it for a pairing that
# asks nothing; this desktop has no one to ask, so the answer is never. A
# device that really did lose its keys is forgotten on the tab and paired
# again, which is a press somebody makes.
JustWorksRepairing = never

[Policy]
# The radio stays off until someone asks for it.
#
# It is on at every boot otherwise, whether or not anything is paired, and a
# radio no one is listening to is a radio spending a battery. Nothing on this
# machine needs it to come up: the pad is wired, the speakers are the machine's
# own, and the one thing anyone plugs in arrives over USB.
#
# The Bluetooth tab turns it on, which is `console-bluetooth on`, and it is
# the first row on the tab whenever the radio is off. Turned on that way it
# stays on until the machine is next started.
AutoEnable=false
