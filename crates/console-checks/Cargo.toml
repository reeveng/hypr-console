[package]
name = "console-checks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_checks"
path = "src/lib.rs"

[[bin]]
name = "console-check"
path = "src/bin/console-check.rs"

[dependencies]
console-door.workspace = true
console-pad.workspace = true
console-stage.workspace = true
evdev = "0.13"
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
