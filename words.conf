# The words this desktop decided on.
#
# Every word here is written far more often in this tree than English writes it,
# which is what a vocabulary is: the words a thing says because of what it is.
# The heading is the whole argument for a word being here. A word that would
# need a second heading to explain itself is a word doing two jobs, and the
# place to see that is this file rather than a diff.
#
# `console-vocabulary` counts what the tree writes, measures it against how
# often English writes the same word, and its test is the gate: a word written
# more than fifty times English's own rate, and written ten times or more, is
# either under a heading here or the gate is red. Nothing about spelling is decided
# here and nothing about how often -- a word under a heading may be written as
# often as it likes.
#
# Three kinds of word are never written here, because they are a list already:
# the name of a crate in this tree, the name of a program this desktop runs or
# the package it comes from, and the negative of a word -- `unpressed` is
# `press`, and a list that spelled out every `un` would be one decision written
# thirty times.

