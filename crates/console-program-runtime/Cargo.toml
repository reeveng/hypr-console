[package]
name = "console-program-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_program_runtime"
path = "src/lib.rs"

[dependencies]
# The contract this carries out. Nothing here decides anything; everything it
# decides is over there.
console-program-contract.workspace = true
# What a program is allowed to name when it wants something run.
console-core-external-programs.workspace = true
# A child started on somebody's behalf is theirs, and is never ended by us.
console-program-lifetime.workspace = true
# The error of a program that cannot have one of its own.
console-core-never.workspace = true
# The one subscription per source on this machine. `Wants::Words` is a program
# asking to be told, and this is who tells it.
console-events.workspace = true

[lints]
workspace = true
