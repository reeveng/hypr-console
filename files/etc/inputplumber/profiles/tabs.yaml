# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/device_profile_v1.json
version: 1
kind: DeviceProfile
name: Tabs
description: >
  The menu profile, plus a way to move between the tabs of a panel that has
  more than one. The shoulders carry a window between workspaces on the
  desktop, so here they carry the panel between its tabs, and left and right
  do the same for a thumb already on the d-pad.

  Loaded while a chooser is on screen, and only then. A chooser is driven by
  the highlight, not by the pointer: A confirms the highlighted row rather than
  clicking whatever the pointer happens to be over. The pointer still works for
  anyone who would rather reach for it.

  /usr/local/bin/launcher loads this before the menu and puts the desktop
  profile back afterwards.

# The pad is published here too. A profile that leaves it out makes
# InputPlumber destroy it and build a new one on the way back, which every
# menu open and close did: the keyboard loses the pad it reads, the controller
# daemon loses the pad it reads, and X, which is the keyboard wherever you are,
# reaches nothing while a chooser is up because there is nothing to reach.
#
# So the pad stays, and the buttons that would act behind an open chooser are
# named here and sent nowhere, rather than left out and left to chance.
target_devices:
  - mouse
  - keyboard
  - xbox-elite

mapping:
  - name: A - choose the highlighted row
    source_event:
      gamepad:
        button: South
    target_events:
      - keyboard: KeyEnter

  - name: B - never mind
    source_event:
      gamepad:
        button: East
    target_events:
      - keyboard: KeyEsc

  - name: D-pad up - move the highlight up
    source_event:
      gamepad:
        button: DPadUp
    target_events:
      - keyboard: KeyUp
  - name: D-pad down - move the highlight down
    source_event:
      gamepad:
        button: DPadDown
    target_events:
      - keyboard: KeyDown

  - name: Left stick up - move the highlight up
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: up
          deadzone: 0.5
    target_events:
      - keyboard: KeyUp
  - name: Left stick down - move the highlight down
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: down
          deadzone: 0.5
    target_events:
      - keyboard: KeyDown

  - name: Right stick up - move the highlight up
    source_event:
      gamepad:
        axis:
          name: RightStick
          direction: up
          deadzone: 0.5
    target_events:
      - keyboard: KeyUp
  - name: Right stick down - move the highlight down
    source_event:
      gamepad:
        axis:
          name: RightStick
          direction: down
          deadzone: 0.5
    target_events:
      - keyboard: KeyDown

  - name: X - show or hide the keyboard
    source_event:
      gamepad:
        button: North
    target_events:
      - gamepad:
          button: North

  - name: Right paddle, top - close the menu
    source_event:
      gamepad:
        button: RightPaddle1
    target_events:
      - keyboard: KeyEsc

  - name: Legion right - close the menu
    source_event:
      gamepad:
        button: QuickAccess
    target_events:
      - keyboard: KeyEsc

  - name: Legion left - nothing while a chooser is up
    source_event:
      gamepad:
        button: Guide
    target_events: []

  - name: Menu - nothing while a chooser is up
    source_event:
      gamepad:
        button: Start
    target_events: []

  - name: View - nothing while a chooser is up
    source_event:
      gamepad:
        button: Select
    target_events: []

  - name: L1 - the tab to the left
    source_event:
      gamepad:
        button: LeftBumper
    target_events:
      - keyboard: KeyPageUp

  - name: R1 - the tab to the right
    source_event:
      gamepad:
        button: RightBumper
    target_events:
      - keyboard: KeyPageDown

  - name: D-pad left - the tab to the left
    source_event:
      gamepad:
        button: DPadLeft
    target_events:
      - keyboard: KeyLeft

  - name: D-pad right - the tab to the right
    source_event:
      gamepad:
        button: DPadRight
    target_events:
      - keyboard: KeyRight
