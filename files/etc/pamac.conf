### Pamac configuration file
###
### Carried by the manifest, because two of the answers in it are decisions
### this desktop makes rather than defaults it accepts.
###
### Flatpak is on. It is where the applications a person actually asks for
### are, it installs without touching the system, and it means one search box
### rather than a second store to learn. AUR is left off: it builds from
### source, on a handheld, and a package that fails to build at midnight is
### not something to hand somebody who wanted a photo viewer.
###
### A pamac update will put the packaged copy back over this, which `legion
### check` reports as a difference like any other.

## When removing a package, also remove those dependencies
## that are not required by other packages (recurse option):
#RemoveUnrequiredDeps

## How often to check for updates, value in hours (0 to disable):
RefreshPeriod = 6

## When no update is available, hide the tray icon:
#NoUpdateHideIcon

## When applying updates, enable packages downgrade:
#EnableDowngrade

## When installing packages, do not check for updates:
#SimpleInstall

## Allow Pamac to search and install packages from AUR:
#EnableAUR

## Keep built packages from AUR in cache after installation:
#KeepBuiltPkgs

## When AUR support is enabled check for updates from AUR:
#CheckAURUpdates

## When check updates from AUR support is enabled check for vcs updates:
#CheckAURVCSUpdates

## AUR build directory:
BuildDirectory = /var/tmp

## Number of versions of each package to keep when cleaning the packages cache:
KeepNumPackages = 3

## Remove only the versions of uninstalled packages when cleaning the packages cache:
#OnlyRmUninstalled

## Download updates in background:
#DownloadUpdates

## Offline upgrade:
#OfflineUpgrade

## Maximum Parallel Downloads:
MaxParallelDownloads = 4

## Search and install applications from Flathub as well as from the repositories:
EnableFlatpak

## Check for updates to those too:
CheckFlatpakUpdates
