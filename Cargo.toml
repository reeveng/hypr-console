# Every program on this device, in one workspace.
#
# The device builds these itself: `rust` is in desktop.conf's [packages] and
# `console apply` runs cargo before it installs. So the manifest stays the whole
# truth about the machine, nothing compiled is kept in git, and the public copy
# of this repository is source and nothing else.

[workspace]
members = ["crates/*"]
# The lint suite is a workspace of its own, on a nightly of its own.
exclude = ["tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
console-applications = { path = "crates/console-applications" }
console-input-mapping = { path = "crates/console-input-mapping" }
console-program-lifetime = { path = "crates/console-program-lifetime" }
console-core-colour = { path = "crates/console-core-colour" }
console-input-controller = { path = "crates/console-input-controller" }
console-cpu-boost = { path = "crates/console-cpu-boost" }
console-default-applications = { path = "crates/console-default-applications" }
console-device = { path = "crates/console-device" }
console-input-dictation = { path = "crates/console-input-dictation" }
console-downloads = { path = "crates/console-downloads" }
console-events = { path = "crates/console-events" }
console-core-external-programs = { path = "crates/console-core-external-programs" }
console-test-checks = { path = "crates/console-test-checks" }
console-core-atomic-writes = { path = "crates/console-core-atomic-writes" }
console-files = { path = "crates/console-files" }
console-input-gamepad = { path = "crates/console-input-gamepad" }
console-button-guide = { path = "crates/console-button-guide" }
console-home-screen = { path = "crates/console-home-screen" }
console-how-far = { path = "crates/console-how-far" }
console-input-focus = { path = "crates/console-input-focus" }
console-input-keyboard = { path = "crates/console-input-keyboard" }
console-launcher = { path = "crates/console-launcher" }
console-manifest-migrations = { path = "crates/console-manifest-migrations" }
console-music = { path = "crates/console-music" }
console-test-desktop = { path = "crates/console-test-desktop" }
console-core-never = { path = "crates/console-core-never" }
console-notifications = { path = "crates/console-notifications" }
console-core-number-conversion = { path = "crates/console-core-number-conversion" }
console-onscreen = { path = "crates/console-onscreen" }
console-panel = { path = "crates/console-panel" }
console-panels = { path = "crates/console-panels" }
console-program-contract = { path = "crates/console-program-contract" }
console-program-runtime = { path = "crates/console-program-runtime" }
console-core-reconnect = { path = "crates/console-core-reconnect" }
console-repository = { path = "crates/console-repository" }
console-screen = { path = "crates/console-screen" }
console-session = { path = "crates/console-session" }
console-settings = { path = "crates/console-settings" }
console-test-stages = { path = "crates/console-test-stages" }
console-core-localization = { path = "crates/console-core-localization" }
console-media-viewer = { path = "crates/console-media-viewer" }
console-input-pointer = { path = "crates/console-input-pointer" }
console-input-touchscreen = { path = "crates/console-input-touchscreen" }
console-response-times = { path = "crates/console-response-times" }
console-wallpaper = { path = "crates/console-wallpaper" }
console-waiting = { path = "crates/console-waiting" }

[profile.release]
# A handheld compiles this, so the build is kept cheap. None of these programs
# is hot: the panel waits for a thumb and the theme runs when a colour changes.
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true

# `cargo dylint --all` finds the lint libraries here. The Explicit-Rust suite
# lives at tools/explicit-rust; `just ready` enforces the denied rules through
# `just explicit-gate`, and `just explicit` counts the warned one.
[workspace.metadata.dylint]
libraries = [{ path = "tools/explicit-rust", pattern = "explicit*" }]

# The lints, in one place. Every crate says `[lints] workspace = true` and
# nothing else, so a rule is added here once instead of in each manifest that
# remembers to -- and a rule written once per crate is a rule the next crate
# forgets.
[workspace.lints.rust]
# `dylint_lib` is set by `cargo dylint` and by nothing else, so an EXPLICIT
# allow at a call site is inert under an ordinary build. Declared here or that
# build warns the name is unknown.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(dylint_lib, values(any()))'] }

# What clippy is told to stop saying, and what it is asked to say instead.
#
# One argument runs under every allow here: the rule the workspace wrote for
# itself outranks the one it inherited, and where the two cannot both be
# satisfied it is the inherited one that gives way.
#
# The first five want an `if` back where the workspace has written a `match`,
# and EXPLICIT019 is the rule that put the `match` there: both outcomes on the
# screen, each with a name, and a third outcome later is an arm rather than a
# rewrite.
#
# `manual_ok_err` is the same standoff over a different word. It asks for
# `var(..).ok()` wherever a `Result` is matched into an `Option`, and EXPLICIT001
# and EXPLICIT006 both deny that call for a reason this file agrees with: an
# `Option` should mean the value may not exist, not that something failed and
# nobody was told. Nothing can satisfy both at the call site, because each denies
# what the other asks for. Settled here once rather than by an `#[allow]` beside
# every variable a program reads.
[workspace.lints.clippy]
single_match = "allow"
single_match_else = "allow"
match_bool = "allow"
equatable_if_let = "allow"
option_if_let_else = "allow"
manual_ok_err = "allow"

# The other direction: stock rules that say what the suite already says, or
# name a harm no EXPLICIT rule covers. Nothing in the tree breaks any of them
# today, which is the only reason they are `deny` -- the same ratchet
# tools/explicit-rust/README.md describes, spent on rules somebody else wrote.
allow_attributes_without_reason = "deny"   # EXPLICIT018, in stock clippy
rest_pat_in_fully_bound_structs = "deny"   # EXPLICIT016's `..`, over structs
fallible_impl_from = "deny"                # a `From` that panics instead
iter_over_hash_type = "deny"               # an order that changes run to run
mixed_read_write_in_expression = "deny"    # a value that depends on which side
path_buf_push_overwrite = "deny"           # a leading `/` eating the path
read_zero_byte_vec = "deny"                # a read into nowhere, reporting none
debug_assert_with_mut_call = "deny"        # work the release build skips
significant_drop_in_scrutinee = "deny"     # a lock held across every arm
collection_is_never_read = "deny"          # filled, and then nobody asks
suspicious_operation_groupings = "deny"    # `a.x == b.x && a.y == b.x`
empty_line_after_doc_comments = "deny"     # a blank line orphaning the prose
empty_line_after_outer_attr = "deny"       # and the same, orphaning an attribute
