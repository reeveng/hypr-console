[package]
name = "console-input-gamepad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "capture-devices"
path = "src/bin/capture.rs"

[[bin]]
name = "allow-uinput"
path = "src/bin/allow-uinput.rs"

[[bin]]
name = "console-emulate"
path = "src/bin/emulate.rs"
required-features = ["read"]

[features]
read = ["dep:serde_yaml_ng"]

[dependencies]
console-core-external-programs.workspace = true
console-core-geometry.workspace = true
console-core-ini-files.workspace = true
console-core-never.workspace = true
console-core-words.workspace = true
console-program-contract.workspace = true
console-program-runtime.workspace = true
console-repository.workspace = true
console-core-number-conversion.workspace = true
console-input-event-devices.workspace = true
rustix.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = { version = "0.10", optional = true }

[dev-dependencies]
console-input-gamepad = { path = ".", features = ["read"] }

[lints]
workspace = true
