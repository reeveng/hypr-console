# The confinement in console-.service.d/confining.conf, taken back off.
#
# This is where things are opened now. A row on the menu starts an application,
# a row on the files opens whatever claims that file, and the settings panel's
# Web tab is the one place this desktop calls `sudo` -- all of which used to
# happen in a panel's own process, started by the bar, and lands here instead.
# A scope does not escape it: `systemd-run --user --scope` execs in the
# caller's namespaces, so every line of the prefix drop-in would land on
# Firefox, on Steam and on that `sudo`.
#
# `console-bar.service.d/opening.conf` is the same file for the same reason and
# says what has to change before either can go: a program somebody chose is
# started by the manager rather than by us.

[Service]
NoNewPrivileges=no
ProtectSystem=no
PrivateTmp=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
