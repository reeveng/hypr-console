[package]
name = "console-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_session"
path = "src/lib.rs"

[[bin]]
name = "session-start"
path = "src/bin/session-start.rs"

[[bin]]
name = "game-mode"
path = "src/bin/game-mode.rs"

[[bin]]
name = "desktop-mode"
path = "src/bin/desktop-mode.rs"

[dependencies]
# The longest wait on the machine is going to Game Mode and coming back, and
# until this it was the one nothing wrote down. `run_each` times the steps it
# runs; the two switches are usually killed halfway through by the session
# going down, and `session-start` -- which runs in the session that is coming
# up -- is the one that always lands.
console-core-external-programs.workspace = true
console-core-never.workspace = true
console-response-times.workspace = true

[lints]
workspace = true
