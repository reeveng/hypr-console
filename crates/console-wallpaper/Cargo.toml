[package]
name = "console-wallpaper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_wallpaper"
path = "src/lib.rs"

[[bin]]
name = "console-wallpaper"
path = "src/bin/console-wallpaper.rs"

[[bin]]
name = "wallpaper-render"
path = "src/bin/wallpaper-render.rs"

[dependencies]
console-core-atomic-writes.workspace = true
console-core-geometry.workspace = true
console-core-never.workspace = true
console-core-places.workspace = true
console-repository.workspace = true
console-core-external-programs.workspace = true
console-core-number-conversion.workspace = true
console-core-words.workspace = true
console-events.workspace = true
console-program-contract.workspace = true
console-program-lifetime.workspace = true
console-compositor.workspace = true
console-onscreen.workspace = true
console-core-color.workspace = true
console-screen.workspace = true
console-weather.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order", "display"] }

[lints]
workspace = true
