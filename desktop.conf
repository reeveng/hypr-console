# What this desktop is made of.
#
# This is the whole inventory. Nothing is installed, enabled or written by
# hand: edit this file, run `legion apply`, and the machine is brought to
# match it. Run `legion check` to see where the machine has drifted away.
#
# The content of every file listed here lives under files/, at the same path.
# /usr/local/bin/launcher is files/usr/local/bin/launcher. Ownership and mode
# are worked out from the path and the content, so there is nothing to keep in
# step: anything under /home/player belongs to player, and anything kept
# in a bin directory, or carrying a shebang, is executable.

# The colours are decided in theme/palette.toml and nowhere else.
# tools/legion-theme writes them out once per language, into the palette files
# listed below, and everything else on this machine imports whichever of those
# speaks its own. So a stylesheet here says @pink and the keyboard says $pink,
# and neither holds a colour that could fall behind the other.
#
# theme/report.md is the palette with the contrast between each pair measured:
# AAA for everything that is read, and never under AA for anything at all.
# docs/theme.md is the rest of it.

[packages]
# The desktop itself.
hyprland
waybar
wofi
alacritty

# The controller. inputplumber remaps the pad; python-evdev is what the
# controller daemon reads it with.
inputplumber
python-evdev

# What the bar's icons open when they are tapped.
pavucontrol
blueman
network-manager-applet
power-profiles-daemon
brightnessctl

# The look: the background, and the icons the bar and the menu draw.
hyprpaper
papirus-icon-theme


[files]
# The compositor. Everything else is started by the target, not from here.
/home/player/.config/hypr/hyprland.lua
/home/player/.config/legion/palette.css
/home/player/.config/legion/palette.toml

# The controller. This is the shipped device definition, edited: a copy in
# devices.d does not replace it, it is loaded as well, and the two together
# claim the same hardware twice. A package update will put the original back,
# which `legion check` reports as a difference like any other.
#
# desktop.yaml is the map: what every button on this device means. keyboard.yaml and menu.yaml are what it becomes while the on-screen
# keyboard or a chooser is up.
/usr/share/inputplumber/devices/50-legion_go.yaml
/etc/inputplumber/profiles/desktop.yaml
/etc/inputplumber/profiles/keyboard.yaml
/etc/inputplumber/profiles/menu.yaml
/etc/inputplumber/profiles/tabs.yaml
/usr/local/bin/controller-profile
/usr/local/bin/stick-scroll

# The on-screen keyboard, and the two scripts that show and hide it.
/usr/local/bin/osk-start
/usr/local/lib/legion/palette.sh
/usr/local/bin/osk
/usr/local/bin/osk-hook

# The menu, and the chooser the battery icon opens. legion-buttons is the
# guide to what every button does, and appears in the menu as "Buttons".
/usr/local/bin/launcher
/usr/local/bin/legion-volume
/usr/local/bin/settings-panel
/usr/local/lib/legion/panel.py
/usr/local/bin/legion-buttons
/usr/local/bin/legion-brightness
/usr/local/bin/legion-screenshot
/usr/share/applications/legion-buttons.desktop
/home/player/.config/wofi/config
/home/player/.config/wofi/style.css
/usr/share/icons/legion-placeholder.svg

# The bar.
/home/player/.config/waybar/config.jsonc
/home/player/.config/waybar/style.css

# The look, everywhere it reaches: the background, the terminal, GTK apps,
# Qt apps, and the browser. The same palette in each, because a desktop that
# is pink in one window and blue in the next reads as an accident.
/usr/share/backgrounds/legion.png
/home/player/.config/hypr/hyprpaper.conf
/home/player/.config/alacritty/alacritty.toml
/home/player/.config/gtk-3.0/gtk.css
/home/player/.config/gtk-3.0/settings.ini
/home/player/.config/gtk-4.0/gtk.css
/home/player/.config/gtk-4.0/settings.ini
/home/player/.config/kdeglobals
/etc/firefox/policies/policies.json
/home/player/.mozilla/firefox/profiles.ini
/home/player/.mozilla/firefox/legion/user.js
/home/player/.mozilla/firefox/legion/chrome/palette.css
/home/player/.mozilla/firefox/legion/chrome/userChrome.css
/home/player/.mozilla/firefox/legion/chrome/userContent.css

# Nothing on this machine animates. Hyprland, GTK, Qt and Firefox are each
# told separately, because each keeps its own idea of it, and the boot splash
# is gone from the initramfs hooks.
/etc/mkinitcpio.conf
/etc/udev/rules.d/90-legion-backlight.rules
/etc/udev/rules.d/91-legion-touchpad.rules

# The session: which one logs in, and how to get to the Steam one.
/etc/plasmalogin.conf.d/zzz-session.conf
/usr/local/bin/steamos-session-select
/usr/local/bin/game-mode

# The units. One target pulls in the four services the desktop is made of, and
# the compositor starts that target and nothing else.
/etc/systemd/user/legion.target
/etc/systemd/user/legion-controller.service
/etc/systemd/user/legion-keyboard.service
/etc/systemd/user/legion-bar.service
/etc/systemd/user/legion-session.service
/etc/systemd/user/legion-paper.service
/usr/local/bin/session-start

# What legion-session starts. A fork, like the keyboard, so the built program
# is carried here: a machine put back together from the manifest alone has to
# end up with this one and not whatever is published under the name.


[services]
# Enabled for player, and pulled in together by legion.target. Each one
# restarts itself, so losing a piece costs seconds rather than the session.
legion-controller.service
legion-keyboard.service
legion-bar.service
legion-session.service
legion-paper.service


[masked]
# This unit rewrites the autologin setting back to Game Mode on every logout,
# which is how the machine kept arriving back at a session nobody chose.
cachyos-gamescope-autologin.service


[elsewhere]
# Two programs this desktop is made of, which this repository does not carry.
#
# Both are forks of somebody else's work, kept on the machine as built
# programs. Publishing a binary means publishing the source that made it, and
# that source is theirs rather than ours. docs/forks.md says what each one is,
# what the fork changes, and how to build it. Build it, put it at the path
# named here, move that line up into [files], and apply will carry it.
#
# Listed rather than left out, so that a unit starting a program nothing
# installs stays the failure it should be everywhere else.
/usr/local/bin/wvkbd-mobintl
/usr/local/bin/hyprsession
