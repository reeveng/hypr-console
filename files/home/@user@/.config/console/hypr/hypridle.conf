# What happens when no one is doing anything.
#
# The screen dims, then it locks and goes out, then the machine sleeps. The
# lock is the one step that depends on the person: it is there when they have
# chosen a login pattern and absent when they have not.
#
# There was no lock for a long time, and on purpose. The only way to type on
# this machine is the on-screen keyboard, which is a layer this desktop puts
# above whatever is up, and a lock screen that asks for a password takes the
# keyboard's place above everything -- so the password could be asked for and
# not answered, and a device that cannot be unlocked is worse than one that is
# not locked. The login pattern is what changed that. It is drawn with the pad
# or a finger and needs no keyboard at all, so `lock-screen` asks for the same
# dots the greeter does, and a person who never chose any is never asked.
#
# The times are what a device that is held wants rather than what a laptop
# does. Two minutes is long enough to read a page of the guide without the
# screen going under your thumb, five is short enough that a machine put down
# face up is dark before the room is, and ten is far enough past the blank
# that a screen which went out on somebody still holding it has had five
# minutes to be wrong in.

general {
    # Locking is a unit rather than the program, because a start that is
    # already running is a start that returns, and both hooks below may ask
    # for it within a second of each other. `console-lock.service` is
    # `Type=notify` and `lock-screen` says it is ready once the compositor
    # says the session is locked -- or at once, when there is no pattern and
    # so nothing to lock with.
    #
    # `loginctl lock-session` is what calls lock_cmd, and the blank below is
    # what calls that. The sleep hook asks for the unit itself and waits, and
    # `inhibit_sleep = 1` is what holds the suspend until it returns: a
    # machine that went to sleep before the lock was up would wake showing
    # the desktop for the frame it takes the lock to draw. Being told of the
    # suspend over the bus is what makes this run for the Sleep row, a closed
    # lid and the listener at the end alike.
    #
    # Nothing unlocks from here. The lock is let go by the pattern and by
    # nothing else, so unlock_cmd and the wake hook stay empty.
    lock_cmd = /usr/bin/systemctl --user start console-lock.service
    unlock_cmd =
    before_sleep_cmd = /usr/bin/systemctl --user start console-lock.service
    after_sleep_cmd =
    inhibit_sleep = 1
}

# Dim, and remember where it was.
#
# `console-brightness` and not `brightnessctl -s`, because putting a screen back
# means having remembered where it was, and this desktop already keeps that in
# one place along with what full means on this panel. It also declines to
# restore over the top of someone who reached for the rocker while it was dim.
listener {
    timeout = 120
    on-timeout = /usr/local/bin/console-brightness dim
    on-resume = /usr/local/bin/console-brightness undim
}

# Then out altogether.
#
# The Lua form, and it has to be. This machine's compositor is configured in
# Lua, so `hyprctl dispatch dpms off` -- which is what every example of this
# file on the internet says -- comes back "')' expected near 'off'" and the
# screen stays on for ever. Nothing would have reported that: the daemon runs
# the command, the command fails, and the only symptom is a device whose screen
# never goes off.
#
# No `on-resume` here, and that is the whole of it. `console-brightness undim`
# above puts the panel on before it does anything else, with this same dispatch,
# and hypridle resumes every listener that timed out at the same instant -- so a
# machine woken after five minutes sent the compositor two of them at once. What
# came back was `ok` and a screen that stayed dark: the state was on, the panel
# was not, and the only way out was a disable and an enable from somewhere else.
# One thing puts the screen back on, and it is the one that also knows how
# bright it was.
listener {
    timeout = 300
    on-timeout = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
}

# And locked as it goes out, which is when a phone locks: a screen that is
# dark is a device somebody may pick up who is not the person who put it down,
# and the five minutes before the suspend are five minutes of that.
listener {
    timeout = 300
    on-timeout = /usr/bin/loginctl lock-session
}

# Then asleep, because a dark screen is not a machine that has stopped.
#
# This step was refused for a long time and the reason it was refused was that
# nothing had proved this machine comes back from a suspend -- the pad is
# rebuilt by InputPlumber on resume, and a device that will not wake in
# somebody's hands spends more trust than a battery is worth. That is now the
# one thing here that has been measured rather than feared: the device suspends
# and resumes over and over between a person putting it down and picking it up,
# `amd_pmc` reports S0i3 entered and left cleanly every time, and the longest
# one anybody has stood over held real hardware sleep for all but three seconds
# of the gap it covered.
#
# What was measured next is why the step is here at all. Awake with the panel
# already out this machine draws 2.78 W, read off the package over a minute
# with nobody touching it; asleep it draws about a quarter of one. Every hour
# past the blank is therefore about a sixteenth of a full battery spent on a
# screen nobody is looking at, so a machine put down after lunch has got
# through a good part of it by evening having been used for none of it. The
# blank was doing the visible half of the job and none of the expensive half.
#
# Five minutes past the blank rather than at it. The screen going out is a
# guess that nobody is there and it is wrong often -- a person reading, a song
# playing, a download. Waking from a wrong blank costs a thumb; waking from a
# wrong suspend costs the seconds the compositor and the pad take to come back,
# and it is that difference the gap is for.
#
# It was ten, and five is the same bet at half the stake. What changed is the
# case a wrong suspend used to ruin: a song now holds a `sleep` lock of its
# own, so the thing that was worth ten minutes of waiting for is answered
# rather than waited out.
#
# A song is the case this has to be wrong about in the right direction, and it
# is answered rather than guessed at. Anything holding a logind sleep inhibitor
# is answered by the suspend failing -- an apply takes one, which is the lock
# `console-manifest-engine` has always held, and `console-awake` takes the same
# one for as long as a track is actually playing. The idle inhibitors hypridle
# reads itself are the wrong instrument for it: they are read once for the
# whole file, so a player that took one would keep the panel lit as well, which
# is the expensive half. The lock that belongs here is `sleep` and it belongs
# to whatever is making the sound.
listener {
    timeout = 600
    on-timeout = /usr/bin/systemctl suspend
}
