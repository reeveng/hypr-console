[package]
name = "console-panel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_panel"
path = "src/lib.rs"

# A yes or no, put to whoever is holding the device, for the programs that
# change this machine from a laptop and have no business answering for them.
[[bin]]
name = "console-confirm"
path = "src/bin/console-confirm.rs"

[[bin]]
name = "put-away"
path = "src/bin/put-away.rs"

# Not a program on the device. The chooser's lock is between processes, so the
# test that proves it wants a second process to be the other chooser.
[[bin]]
name = "second-chooser"
path = "src/bin/second-chooser.rs"

[[bin]]
name = "bar-door"
path = "src/bin/bar-door.rs"

# The pictures every list draws, decoded once into the one file they read.
[[bin]]
name = "panel-pictures"
path = "src/bin/panel-pictures.rs"

[dependencies]
console-program-lifetime.workspace = true
console-core-external-programs.workspace = true
console-core-never.workspace = true
console-core-places.workspace = true
console-waiting.workspace = true
console-core-number-conversion.workspace = true
console-compositor.workspace = true
console-onscreen.workspace = true
# The one subscription per source on this machine. What used to be this
# program's own connection to the compositor is a line down the pool's socket.
console-events.workspace = true
console-response-times.workspace = true
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
libc = "0.2"
serde_json = "1"

[dev-dependencies]
# The panel stage, which opens a panel in the nested desktop and reads back what
# it drew. It depends on this crate in turn, which cargo allows exactly here: a
# dev-dependency cycle is not a build cycle, because the checks are built after
# the library they check.
console-test-stages.workspace = true

[lints]
workspace = true
