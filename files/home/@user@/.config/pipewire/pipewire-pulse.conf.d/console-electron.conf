# Give Chromium-based apps distinct mixer identities when their executable
# identifies them. WirePlumber uses application.id to save volume and mute.
pulse.rules = [
    {
        matches = [
            { application.name = "Chromium" application.process.binary = "signal-desktop" }
        ]
        actions = {
            update-props = {
                application.id = "org.signal.Signal"
                application.name = "Signal"
            }
        }
    }
    {
        matches = [
            { application.name = "Chromium" application.process.binary = "~^(freetube|FreeTube)$" }
        ]
        actions = {
            update-props = {
                application.id = "io.freetubeapp.FreeTube"
                application.name = "FreeTube"
            }
        }
    }
    {
        matches = [
            { application.process.binary = "~^electron(-[0-9]+)?$" application.id = null }
            { application.process.binary = "~^electron(-[0-9]+)?$" application.id = "org.chromium.Chromium" }
        ]
        actions = {
            update-props = {
                state.restore-props = false
            }
        }
    }
]
