[package]
name = "console-panel"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_panel"
path = "src/lib.rs"

# Not a program on the device. The chooser's lock is between processes, so the
# test that proves it wants a second process to be the other chooser.
[[bin]]
name = "put-away"
path = "src/bin/put-away.rs"

[[bin]]
name = "second-chooser"
path = "src/bin/second-chooser.rs"

[[bin]]
name = "bar-door"
path = "src/bin/bar-door.rs"

# The pictures every list draws, decoded once into the one file they read.
[[bin]]
name = "panel-pictures"
path = "src/bin/panel-pictures.rs"

[dependencies]
console-number.workspace = true
console-door.workspace = true
console-again.workspace = true
console-timings.workspace = true
gtk4 = "0.11"
gtk4-layer-shell = "0.8"
libc = "0.2"
serde_json = "1"

[lints]
workspace = true
