[terminal]
background = "night"
foreground = "text"
cursor = "rose"
selection = "pink"
bright_lift = 0.070

[terminal.normal]
black = "ash"
red = "coral"
green = "leaf"
yellow = "butter"
blue = "sky"
magenta = "pink"
cyan = "mint"
white = "soft"

[[pair]]
front = "text"
back = ["night", "ground", "panel"]
ratio = 7.0
lightness_contrast = 90.0
where = "everything that is read, on every ground it is read against"

[[pair]]
front = "soft"
back = ["night", "ground", "panel"]
ratio = 7.0
lightness_contrast = 75.0
where = "every secondary label on the device"

[[pair]]
front = "text"
back = ["fill"]
ratio = 7.0
lightness_contrast = 75.0
where = "the sentence on a notification filled to a length: the volume, the brightness, the battery"

[[pair]]
front = "fill"
back = ["panel"]
ratio = 1.05
kind = "seen"
where = "the filled part of a notification against the rest of the card, which only has to be seen as a different length"

[[pair]]
front = "night"
back = ["pink", "rose", "mauve", "lilac", "sky", "mint", "leaf", "butter", "peach", "coral"]
ratio = 7.0
lightness_contrast = 75.0
where = "the ink on a highlighted row, a pressed key, an active workspace"

[[pair]]
front = ["pink", "rose", "mauve", "lilac", "sky", "mint", "leaf", "butter", "peach", "coral"]
back = ["night", "ground", "panel"]
ratio = 7.0
lightness_contrast = 75.0
where = "a pastel used as writing rather than as a fill"

[[pair]]
front = "soft"
back = ["ground"]
ratio = 7.0
lightness_contrast = 75.0
where = "the swipe trail across the keyboard, and the face of a key that is not a letter. Those keys are the slab's own color, so what is written on them is read against it"

[[pair]]
front = "edge"
back = ["ground", "panel"]
ratio = 3.0
lightness_contrast = 30.0
kind = "edge"
where = "a border, which is looked at rather than read"

[[pair]]
front = "ash"
back = ["night"]
ratio = 4.5
lightness_contrast = 45.0
kind = "quiet"
where = "a terminal printing in black. The one thing on the machine held below the floors everything else clears, because a black light enough to clear them would be lighter than half the palette and would stop meaning black. It is the Lc that places it now: the ratio it lands on is well past the AA it asks for"

[[pair]]
front = "ground"
back = ["night"]
ratio = 1.05
kind = "seen"
where = "the bar against the wallpaper behind it, which only has to be seen as a different thing"

[[pair]]
front = "panel"
back = ["ground"]
ratio = 1.1
kind = "seen"
where = "a menu against the bar"
