[package]
name = "console-core-mermaid"
version = "0.10.0-alpha.2"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/Latias94/merman"
repository = "https://github.com/Latias94/merman"
rust-version = "1.95"
description = "Parity-focused, headless Rust implementation of Mermaid for parsing, layout, and rendering."
documentation = "https://docs.rs/merman"
keywords = ["mermaid", "diagrams", "svg", "parser", "headless"]
categories = ["parser-implementations", "visualization"]
exclude = [
    "src/theme_acceptance.rs",
    "tests/mindmap_br_variants_031.rs",
    "tests/resvg_safe_fixture_smoke.rs",
    "tests/zed_mermaid_issue_fixtures.rs",
    "tests/zed_pr_57644_corpus.rs",
]

[package.metadata.docs.rs]
features = [
    "all-diagrams",
    "svg",
    "png",
    "jpeg",
    "pdf",
    "layout-cytoscape",
    "layout-elk",
    "math",
    "system-clock",
    "system-timezone",
    "system-random",
    "system-timing",
]

[package.metadata.merman]
artifact-profile-required = true

