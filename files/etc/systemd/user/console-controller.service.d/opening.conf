# The confinement in console-.service.d/confining.conf, taken back off.
#
# This is the buttons, and the left Legion button leaves for Steam. The way it
# leaves is `pkexec`: the switcher records which session logs in through the
# helper polkit already lets this user run. `NoNewPrivileges=` makes that call
# fail with "pkexec must be setuid root" -- the bit is still on the file and the
# kernel is refusing to honour it -- so the choice was never written, and the
# compositor exit that follows took the desktop down to bring the same desktop
# back with everything closed. The button did that three times in a row on the
# evening the prefix drop-in landed, and said nothing a person could see.
#
# The switcher checks that call now, so a refusal stops before the exit rather
# than after it. That turns this into a button that does nothing, which is why
# the line below is the fix and the check is only the way it would have been
# found sooner.
#
# Leaving is not the only reason. This unit opens the launcher, and through the
# launcher every application on the machine, in its own context:
# `systemd-run --user --scope` execs in the caller's namespaces rather than
# forking through the manager, so a scope does not escape any of it.
#
# It has to be a drop-in rather than a line in console-controller.service. A
# unit file is read before every drop-in it has, and the prefix one lands after
# it: written there, this would be overwritten by the file it is undoing.

[Service]
NoNewPrivileges=no
ProtectSystem=no
PrivateTmp=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
