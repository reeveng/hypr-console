# The confinement in console-.service.d/confining.conf, taken back off.
#
# The home screen opens applications from its squares, the same way the bar
# opens them from its icons, and by the same call: `systemd-run --user --scope`
# execs in the caller's namespaces rather than forking through the manager. A
# sandbox here is a sandbox on whatever a person pressed.
#
# The argument is in `confining.conf`, and so is what would have to change
# first. This unit also holds a render node open -- it draws with the GPU --
# which is the second reason a private /dev would not do.

[Service]
NoNewPrivileges=no
ProtectSystem=no
PrivateTmp=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
