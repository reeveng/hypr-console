# Every program on this device, in one workspace.
#
# The device builds these itself: `rust` is in desktop.conf's [packages] and
# `console apply` runs cargo before it installs. So the manifest stays the whole
# truth about the machine, nothing compiled is kept in git, and the public copy
# of this repository is source and nothing else.

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
console-checks = { path = "crates/console-checks" }
console-colour = { path = "crates/console-colour" }
console-controller = { path = "crates/console-controller" }
console-defaults = { path = "crates/console-defaults" }
console-desktop = { path = "crates/console-desktop" }
console-files = { path = "crates/console-files" }
console-garden = { path = "crates/console-garden" }
console-music = { path = "crates/console-music" }
console-pad = { path = "crates/console-pad" }
console-panel = { path = "crates/console-panel" }
console-random = { path = "crates/console-random" }
console-screen = { path = "crates/console-screen" }
console-sky = { path = "crates/console-sky" }
console-stage = { path = "crates/console-stage" }
console-voice = { path = "crates/console-voice" }

[profile.release]
# A handheld compiles this, so the build is kept cheap. None of these programs
# is hot: the panel waits for a thumb and the theme runs when a colour changes.
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
