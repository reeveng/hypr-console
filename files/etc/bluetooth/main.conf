# Bluetooth, as this machine wants it.
#
# Short on purpose. bluez compiles in a default for everything it is not told,
# and the file it ships is four hundred lines of those defaults written out as
# comments, which goes stale the day bluez changes one of them. What is here is
# what this desktop decides and nothing else.

[Policy]
# The radio stays off until somebody asks for it.
#
# It is on at every boot otherwise, whether or not anything is paired, and a
# radio nobody is listening to is a radio spending a battery. Nothing on this
# machine needs it to come up: the pad is wired, the speakers are the machine's
# own, and the one thing anybody plugs in arrives over USB.
#
# The Bluetooth tab turns it on, which is `bluetoothctl power on`, and it is
# the first row on the tab whenever the radio is off. Turned on that way it
# stays on until the machine is next started.
AutoEnable=false
