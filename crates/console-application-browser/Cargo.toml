[package]
name = "console-application-browser"
default-run = "console-application-browser"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
checks = []

[[bin]]
name = "console-application-browser"
path = "src/main.rs"

[[bin]]
name = "console-browser-check"
path = "src/bin/console-browser-check.rs"
required-features = ["checks"]

[dependencies]
console-notifications.workspace = true
console-browser-downloads = { path = "../console-browser-downloads" }
console-browser-renderer = { path = "../console-browser-renderer" }
console-concurrency.workspace = true
console-core-arguments.workspace = true
console-core-bounded-reads.workspace = true
console-core-color.workspace = true
console-core-external-programs.workspace = true
console-core-file-urls.workspace = true
console-core-fonts.workspace = true
console-core-geometry.workspace = true
console-core-highlight.workspace = true
console-core-ini-files.workspace = true
console-core-internal-programs.workspace = true
console-core-iteration.workspace = true
console-core-logging = { workspace = true, features = ["std"] }
console-core-never.workspace = true
console-core-number-conversion.workspace = true
console-core-places.workspace = true
console-core-state-machine.workspace = true
console-core-temporary-directories.workspace = true
console-core-urls = { path = "../console-core-urls" }
console-core-web-engine.workspace = true
console-default-applications = { path = "../console-default-applications" }
console-gio.workspace = true
console-input-key-symbols.workspace = true
console-input-text.workspace = true
console-operating-system-linux.workspace = true
console-panel.workspace = true
console-program-lifetime.workspace = true
console-repository.workspace = true
rustix = { workspace = true, features = ["net"] }
serde_json = "1"

[dev-dependencies]
console-core-atomic-writes.workspace = true
criterion.workspace = true

[[bench]]
name = "browser_ui"
harness = false

[lints]
workspace = true
