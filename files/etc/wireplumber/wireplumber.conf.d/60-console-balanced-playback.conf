# New output routes start at 25% on the volume slider (a cubic scale).
# WirePlumber restores the listener's saved level for routes it knows.
wireplumber.settings = {
  device.restore-routes = true
  device.routes.default-sink-volume = 0.015625
}

wireplumber.settings.schema = {
  console.balanced-playback.automatic-leveling = {
    name = "Automatic playback leveling"
    description = "Match the loudness of each playback stream before its volume is applied"
    type = "bool"
    default = true
  }
  console.balanced-playback.night-mode = {
    name = "Night Mode"
    description = "Use stronger dynamic leveling for quiet listening"
    type = "bool"
    default = false
  }
}

wireplumber.profiles = {
  main = { hooks.console.balanced-playback = required }
  policy = { hooks.console.balanced-playback = required }
}

wireplumber.components = [
  {
    name = console-balanced-playback.lua
    type = script/lua
    provides = hooks.console.balanced-playback
    requires = [ support.client-context ]
  }
]

console.balanced-playback = {
  # Six decibels below the rendered volume bell. The Rust test checks these
  # values against the same samples used to play the bell.
  sample-peak = 0.08033752
  sustained-level = 0.01596358

  # Boost sustained quiet programme by at most about 28 dB. Ramp in the
  # allowance between -80 and -70 dBFS RMS to leave very low noise alone.
  max-gain = 24
  noise-floor = 0.00010
  full-gain-level = 0.00032
}
