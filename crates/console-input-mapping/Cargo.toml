[package]
name = "console-input-mapping"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "layout-panel"
path = "src/bin/layout-panel.rs"

# The name is the layer's name. A panel is listed by the compositor under the
# program that drew it, and `Mode::Asking` is read off exactly this word: the
# card being on the screen is the whole of what tells the controller daemon
# that the front of the machine is being asked about rather than used.
[[bin]]
name = "console-asking"
path = "src/bin/console-asking.rs"

[dependencies]
console-core-never.workspace = true
console-program-contract.workspace = true
console-input-controller.workspace = true
console-core-external-programs.workspace = true
console-input-gamepad.workspace = true
# The controller, taken while the card is up. What used to be a profile load.
console-input-focus.workspace = true
console-panel.workspace = true
evdev = "0.13"
gtk4 = "0.11"
gtk4-layer-shell = "0.8"

[lints]
workspace = true
