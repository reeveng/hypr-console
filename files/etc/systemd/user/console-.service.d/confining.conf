# What a console service may reach, which is less than the whole machine.
#
# Until this file there was not one hardening directive in any of these units,
# so every one of them ran with the whole of the person's world in reach: the
# home directory, /etc, every device node, every socket family. None of them
# needs that. A wallpaper daemon decodes pictures. A notification daemon reads
# one config file and draws. The screen-warmer talks to the compositor and to
# nothing else. Not one of them has ever had a reason to become root, load a
# module, set the clock or write /etc, and a program that cannot do a thing is
# a program nobody has to argue about later.
#
# One file, on the same prefix as `restarting.conf` and for the same reason:
# this is one decision about what a program of ours may do, and eleven copies of
# it would be eleven places for it to drift. A unit written later inherits it
# without anybody remembering to, which is the right way round -- a piece that
# needs more than this says so in its own file, and a piece that needs nothing
# says nothing at all.
#
# What is deliberately not here, because it is not one decision:
#
#   `ProtectHome=` -- half of these write there. The waits store, the frame
#   cache, syncthing's whole reason to exist. It is a line in the units that
#   can carry it. What is here rather than there is the hole it has to leave:
#   for a user service `ProtectHome=` covers `/run/user` as well as `/home`,
#   and `$XDG_RUNTIME_DIR/console` is where this desktop keeps the sockets its
#   programs reach each other through and the counts `console-fell` raises a
#   card from. A unit that took the line without this got a read-only runtime
#   directory: the event pool could not bind its socket and fell every five
#   seconds, and `console-fell` -- which runs as `ExecStopPost=` inside that
#   same sandbox -- could not write the count that stops at five cards, so it
#   raised one on every fall. `RuntimeDirectory=` is systemd's own way back in
#   and it is a shared name on purpose: every console service declares the same
#   directory, which is what it is. `Preserve=yes` because it is not this
#   unit's to delete -- a `systemctl stop` on any one of them would otherwise
#   take the whole desktop's runtime state with it.
#
#   `PrivateDevices=` -- the controller and the keyboard open /dev/input, and
#   the password box wants a render node. Also per unit, and the units that
#   take it are most of them.
#
#   `RestrictAddressFamilies=` -- console-sky asks the weather and syncthing is
#   a network program. Everything else gets `AF_UNIX AF_NETLINK` in its own
#   file, which is a socket to the compositor and to the bus and no way off
#   this machine.
#
# And two that are not here because they would not work:
#
#   `ProtectKernelTunables=` would make /sys read-only, and the screen's
#   brightness is a file in it. `console-brightness undim` runs on the way out
#   of console-idle, and a read-only /sys turns that into a screen left at its
#   floor with nothing running that remembers why.
#
#   `ProtectProc=` hides what other users are running, and there are no other
#   users: everything on this machine is the one person's uid, so hidepid hides
#   nothing from anything. The only thing that would put a program out of a
#   program's sight is a user namespace, and that would take the backlight
#   write with it.
#
# The one that is not a line here and decides two of these units anyway:
# `NoNewPrivileges=` is not only what this file says it is. Half of what is
# above is implemented with seccomp, and so is `RestrictAddressFamilies=`,
# which the units write for themselves -- and for a manager with no
# CAP_SYS_ADMIN, which is every user manager, systemd turns a unit carrying any
# seccomp at all into a process with the no-new-privileges bit set, whatever
# the flag says. So a drop-in may write `NoNewPrivileges=no`, `systemctl show`
# may print no, and the bit on the process is one. That is what happened to the
# two units that cross to Game Mode: their drop-ins undid every line here, and
# `RestrictAddressFamilies=AF_UNIX AF_NETLINK`, which nothing here had touched,
# went on setting the bit for them. `pkexec` was refused, the session was never
# recorded, and both halves of the left Legion button did nothing at all --
# while the same crossing from the settings panel worked, because
# `console-panels` never had an address family line to be caught by. The rule
# that follows is the whole of it: a unit that has to become root can carry no
# seccomp, and the flag is not where to read whether it does.
#
# A unit carries a drop-in of its own that takes all of this back off when what
# it starts is a program a person chose rather than a program we wrote. That is
# what decides it, and the set is whichever units are true of that today rather
# than a number written here: the two that cross to Game Mode were missed when
# this file landed, and a count would have read as though they had been
# considered.
# `systemd-run --user --scope` does not fork through the manager: it execs in
# the caller's own namespaces, which was measured rather than assumed -- a
# scope started inside a unit with PrivateTmp sees that unit's empty /tmp. So a
# sandbox on the bar is a sandbox on Firefox, on Steam and on the settings
# panel's one `sudo`, and half-done containment of somebody else's program is
# worse than none, because it is believed. Confining what this repository did
# not write is the larger half of the work and none of it is here.

[Service]
RuntimeDirectory=console
RuntimeDirectoryPreserve=yes
NoNewPrivileges=yes
ProtectSystem=full
PrivateTmp=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
