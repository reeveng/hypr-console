# The confinement in console-.service.d/confining.conf, taken back off.
#
# The bar is where a person opens things. Every on-click in the waybar config
# starts a program in waybar's own context -- the launcher, and through the
# launcher every application on the machine; the settings panel, whose Web tab
# is the one place this desktop calls `sudo`. A scope does not escape that:
# `systemd-run --user --scope` execs in the caller's namespaces, so every line
# of the prefix drop-in would land on Firefox, on Steam and on that `sudo`.
#
# The argument for confining anything at all is in `confining.conf`. What has
# to change before this file can go is that a program somebody chose is started
# by the manager rather than by us; until then this unit is as open as the
# things it opens.

[Service]
NoNewPrivileges=no
ProtectSystem=no
PrivateTmp=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
