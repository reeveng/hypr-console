[package]
name = "console-input-pointer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "console-point"
path = "src/bin/point.rs"

[dependencies]
console-core-never.workspace = true
console-core-number-conversion.workspace = true
# Where a surface is standing, for `--in`. The same walk over `hyprctl layers`
# that answers whether a panel is up answers where it is, so a corner this
# measures from is a corner the rest of the desktop agrees exists.
console-onscreen.workspace = true
console-screen.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[lints]
workspace = true
