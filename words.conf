[text]
# How a run of letters becomes glyphs on a line: Unicode's words for which
# way a run reads and where it may break, OpenType's for what a face measures,
# and a typesetter's for what is drawn through, over and after a line. They
# came in with console-core-text-layout, which is COSMIC Text taken in, and
# the crates that ask it to measure and draw say the same words. A word with a
# place after it is the text engine's own name for one of its parts, or the
