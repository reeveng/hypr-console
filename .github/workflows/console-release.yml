name: Console release

on:
  push:
    tags:
      - 'console-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-05-28
    permissions:
      contents: write
    steps:
      - name: Fetch source
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet .
          git fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$GITHUB_SHA^{commit}")"

      - name: Verify release tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          component='(0|[1-9][0-9]*)'
          [[ "$GITHUB_REF_NAME" =~ ^console-v$component\.$component\.$component$ ]]

      - name: Build Console binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target
          docker run --rm --volume "$PWD:/build" --workdir /build \
            --env CARGO_BUILD_JOBS=4 --env RUSTUP_TOOLCHAIN archlinux:base-devel bash -euc '
              pacman -Syu --needed --noconfirm git libxcrypt pam rustup wayland
              pacman -Scc --noconfirm
              rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
              git config --global --add safe.directory /build
              rustc --edition=2024 -O tools/console-bundle.rs -o target/console-bundle
              target/console-bundle /build/console-x86_64.tar.gz
            '

      - name: Publish the bundle
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          archive=console-x86_64.tar.gz
          latest=true
          if [[ "$(git cat-file -t FETCH_HEAD)" == tag ]]; then
            trailers=$(git cat-file tag FETCH_HEAD | git interpret-trailers --parse)
            if [[ $'\n'"$trailers"$'\n' == *$'\nConsole-Latest: false\n'* ]]; then
              latest=false
            fi
          fi
          if draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [[ "$draft" == false ]]; then
              exit 0
            fi
            gh release upload "$tag" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$archive" \
              --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$latest"
