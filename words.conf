[keymaps]
# XKB's vocabulary, and kbvm's. A keymap is written in a language X11 wrote --
# a `vmod`, an `interp`, a `doodad`, `xkb_compat` -- and a keysym is a name X11
# gave a symbol, so the keysym table spells every alphabet X ships (`hangul`,
# `kana`, `braille`) and the grammar's tokens are its lexer's (`obrace`,
# `cparen`). None of it was chosen here, and it belongs to the crate that reads
