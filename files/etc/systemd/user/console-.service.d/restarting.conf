# Every console service, told never to give up.
#
# All of them are Restart=always, and until this was here all of them stopped
# being that after five falls. systemd's own start limit is five starts in ten
# seconds, and a unit that reaches it is `failed` and stays failed for the rest
# of the session, whatever its Restart= says.
#
# That default is written for the fault the README describes -- a daemon that
# ran for an hour and died -- where five falls in ten seconds means something
# is looping and a machine is better off stopping it. It is written against the
# fault that actually takes this device out. A daemon that cannot start at all,
# because a device node has not come back from a suspend or an apply has just
# written a file it will not read, falls instantly: it burns the five inside
# eight seconds, and the desktop is quietly missing its controller or its
# keyboard for the rest of the session. `console-fell` says so five times, and
# then `saying::showing` takes the card off the screen, which is the count
# behaving exactly as designed around a machine that is never coming back.
#
# So the limit is taken off, and what stands in for it is patience rather than
# surrender. RestartSec stays where each unit put it -- two seconds for the
# ones a person notices, five for the ones they do not -- and from there the
# wait widens to a minute over five steps. A piece that is going to come back
# comes back as fast as it ever did; a piece that cannot goes on trying for the
# length of the session at a cost of one start a minute, and the journal has
# every attempt.
#
# This is a drop-in on a name prefix, which systemd reads for every unit called
# console-something.service. One file, because it is one decision, and eleven
# copies of a paragraph is eleven places for it to drift. `systemctl --user
# show console-bar.service -p StartLimitIntervalUSec -p DropInPaths` is how you
# see it landed.
[Unit]
StartLimitIntervalSec=0

[Service]
RestartSteps=5
RestartMaxDelaySec=60
