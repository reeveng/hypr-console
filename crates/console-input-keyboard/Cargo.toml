[package]
name = "console-input-keyboard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

[lib]
name = "console_input_keyboard"
path = "src/lib.rs"

[[bin]]
name = "console-keyboard"
path = "src/bin/keyboard.rs"
required-features = ["port"]

[[bin]]
name = "keyboard-toggle"
path = "src/bin/toggle.rs"

[[bin]]
name = "keyboard-show"
path = "src/bin/show.rs"

[features]
default = ["port"]
port = [
    "dep:console-concurrency",
    "dep:console-core-parallel-execution",
    "dep:console-wayland",
    "dep:console-input-gamepad",
    "dep:console-input-focus",
    "dep:console-response-times",
    "dep:console-screen",
    "dep:console-input-event-devices",
    "dep:rustix",
    "dep:console-input-keymaps",
    "dep:console-core-path-rasterizer",
    "dep:console-draw-painting",
    "dep:console-core-fonts",
]

[dependencies]
console-wayland = { path = "../console-wayland", features = ["virtual-keyboard"], optional = true }
console-core-arguments.workspace = true
console-concurrency = { workspace = true, optional = true }
console-core-parallel-execution = { workspace = true, optional = true }
console-core-number-conversion.workspace = true
console-core-color.workspace = true
console-core-words.workspace = true
console-program-contract.workspace = true
console-operating-system-linux.workspace = true
console-core-external-programs.workspace = true
console-core-geometry.workspace = true
console-core-highlight.workspace = true
console-core-iteration.workspace = true
console-core-logging.workspace = true
console-core-never.workspace = true
console-core-walking.workspace = true

console-input-gamepad = { workspace = true, optional = true }
console-input-focus = { workspace = true, optional = true }
console-response-times = { workspace = true, optional = true }
console-screen = { workspace = true, optional = true }
console-input-alphabets.workspace = true
console-core-places.workspace = true
console-input-event-devices = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
console-input-keymaps = { workspace = true, optional = true }
console-core-path-rasterizer = { workspace = true, optional = true }
console-draw-painting = { workspace = true, optional = true }
console-core-fonts = { workspace = true, optional = true }
console-core-state-machine.workspace = true

[dev-dependencies]
console-input-controller.workspace = true
console-manifest-engine.workspace = true
console-repository.workspace = true
console-core-temporary-directories.workspace = true

[lints]
workspace = true
