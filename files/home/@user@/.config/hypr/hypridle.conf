# What happens when nobody is doing anything.
#
# Two steps and no third. The screen dims, and then it goes out. It does not
# lock and it does not suspend, and both of those are decisions rather than
# things nobody got round to.
#
# No lock, because the only way to type on this machine is the on-screen
# keyboard, which is a layer this desktop puts above whatever is up. A lock
# screen takes the keyboard for itself and would be above it in turn, so the
# password could be asked for and not answered. A device that cannot be
# unlocked is worse than one that is not locked.
#
# No suspend, because nothing here has ever proved that this machine comes back
# from one -- the pad is rebuilt by InputPlumber on resume, and whether it comes
# back is exactly the kind of thing that is found out by a machine failing to
# wake in somebody's hands. Sleep is on the System tab, where a person chooses
# it and is there to see what happens. The battery a handheld spends with its
# screen off is small; the trust it spends by not waking up is not.
#
# The times are what a device that is held wants rather than what a laptop
# does. Two minutes is long enough to read a page of the guide without the
# screen going under your thumb, and five is short enough that a machine put
# down face up is dark before the room is.

general {
    # Nothing here has a lock screen to run, and saying so is the point: these
    # are the hooks a config copied from elsewhere fills in, and a lock command
    # on this machine is the fault described above.
    lock_cmd =
    unlock_cmd =
    before_sleep_cmd =
    after_sleep_cmd =
}

# Dim, and remember where it was.
#
# `console-brightness` and not `brightnessctl -s`, because putting a screen back
# means having remembered where it was, and this desktop already keeps that in
# one place along with what full means on this panel. It also declines to
# restore over the top of somebody who reached for the rocker while it was dim.
listener {
    timeout = 120
    on-timeout = /usr/local/bin/console-brightness dim
    on-resume = /usr/local/bin/console-brightness undim
}

# Then out altogether.
#
# The Lua form, and it has to be. This machine's compositor is configured in
# Lua, so `hyprctl dispatch dpms off` -- which is what every example of this
# file on the internet says -- comes back "')' expected near 'off'" and the
# screen stays on for ever. Nothing would have reported that: the daemon runs
# the command, the command fails, and the only symptom is a device whose screen
# never goes off.
listener {
    timeout = 300
    on-timeout = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = /usr/bin/hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
