# The background. One image, on whatever monitor there is.
#
# This is hyprpaper 0.8's config and not 0.7's. The older form was three lines,
# `preload`, `wallpaper = ,path` and `splash`, and when the package moved on it
# did not fail: hyprpaper started, reported no error worth reading, and painted
# nothing. What was on screen instead was Hyprland's own default grey, which
# looks enough like a plain background that nobody goes looking for a wallpaper
# daemon. It had been that way for some time before anybody noticed.
#
# The compositor is told the same colour as the picture's darkest corner, so
# that if this ever stops working again the desktop is still the right colour
# rather than a grey nobody chose.
wallpaper {
    monitor =
    path = /usr/share/backgrounds/legion.png
    fit_mode = cover
}

splash_opacity = 0
