# What this desktop is made of.
#
# This is the whole inventory. Nothing is installed, enabled or written by
# hand: edit this file, run `console apply`, and the machine is brought to
# match it. Run `console check` to see where the machine has drifted away.
#
# The content of every file listed here lives under files/, at the same path.
# /usr/local/bin/launcher is files/usr/local/bin/launcher. Ownership and mode
# are worked out from the path and the content, so there is nothing to keep in
# step: anything under /home/@user@ belongs to whoever this desktop is for, and
# anything kept in a bin directory, or carrying a shebang, is executable.
#
# @user@ is not a name. It is the mark that stands for them, and the machine
# says who it is at the moment a file is laid down, so this source names no one
# and installs itself for whoever is running it.
#
# A path under [files] may carry the word `once` after it. That says the tree
# ships what the file starts as and nothing after: it is written when it is not
# there, it is never compared, and something on this machine rewrites it and is
# supposed to. Nothing here is marked today; the marks are in machines.conf,
# each saying above it what rewrites the file and what the tree gives up by not
# looking at it again. Every other line here means what it has always
# meant -- this content, at this path,
# and anything else is drift someone wants to hear about.

# The colors are decided in theme/palette.toml and nowhere else.
# console-palette writes them out once per language, into the palette files
# listed below, and everything else on this machine imports whichever of those
# speaks its own. So a stylesheet here says @pink and the keyboard says $pink,
# and neither holds a color that could fall behind the other.
#
# theme/report.md is the palette with the contrast between each pair measured:
# AAA for everything that is read, and never under AA for anything at all.
# docs/theme.md is the rest of it.

[packages]
# The desktop itself.
hyprland
alacritty

# Hyprland's own dialogs -- the one that asks before a crashed program is
# killed, the one that warns when a config fails to load. Without it the
# compositor opens every session with a notice that it is missing.
hyprland-guiutils

# The controller. inputplumber remaps the pad, and the daemon that reads what
# it publishes is one of the programs this device compiles for itself.
inputplumber

# Every alphabet the on-screen keyboard can type. It ships no keymap of its own:
# `keyboard::keymap` asks xkbcommon to compose one, and xkbcommon reads
# /usr/share/X11/xkb/symbols, which is this package. So Thai is a layer because
# `th` is a file in there, and adding Russian is a row on the Language tab
# rather than a table in this repository.
#
# Never asked for until now, and here for the same reason libpulse and grim
# were: it arrived with the base install and something else keeps it. That was
# harmless while the keyboard carried twelve thousand lines of keymap data and
# needed nothing from the machine. It is not harmless now -- a device rebuilt
# from this manifest alone is not promised it, and a keyboard with no keymap to
# compose says so and stops, which on this device is a device no one can type
# on. `crates/console-manifest-engine/tests/the_keyboard.rs` is what asks.
xkeyboard-config

# What a language and a country are called, in words rather than in codes. The
# Language tab offers every locale glibc can make -- five hundred of them --
# and `nl_NL.UTF-8` is not a thing to put in front of someone. This is the
# system's own answer to that question, the same way xkeyboard-config above is
# its answer to what a key produces, and the alternative was five hundred
# English nouns written into a Rust file, wrong the first time a country is
# renamed and untranslatable the day this desktop says anything in a second
# language.
#
# The panel works without it and says so: a machine with no iso-codes draws the
# codes. It is here because a device rebuilt from this manifest alone is not
# promised a package that arrived with something else.
iso-codes

# How the volume is asked and answered. The settings panel reads and sets it
# with pactl and the bar watches `pactl subscribe` for someone changing it
# somewhere else, and pactl is libpulse's. Sixteen other things on this
# machine pull libpulse in, which is why nothing noticed it was never asked
# for.
libpulse

# The screenshot the bottom right paddle takes, with L2 held. Never asked for
# until now: it was reached for by a shell script, and what holds the crates
# against this list has only ever been able to read the crates. It is on the
# machine because something else pulls it in, which is the same way libpulse
# was here for a year without being wanted.
grim

# How a PDF is read in the library. pdfinfo says how many pages it has and
# pdftoppm draws one of them, the first as its cover and every other as it is
# turned to. A PDF is a program for drawing pages, and poppler is the one
# every reader on Linux rents for it; writing one here is writing a PostScript
# interpreter and a font engine to show a page of text. Without it a PDF is on
# the library under its file name and says it cannot be opened. It arrived with
# the base install, which is not a promise a rebuilt device is made.
poppler

# The screen when no one is looking at it, and the color of it when they are.
#
# hypridle dims and then turns the screen off; hyprsunset takes the blue out of
# it for the evening. Both are the compositor's own, which is what makes them
# worth having over anything this desktop would write: hyprsunset is a color
# transform handed to the compositor rather than a shader over the top, so what
# it does is not in a screenshot, and hypridle is told the machine is idle by
# the compositor rather than guessing from a device it can see.
#
# What each one runs is ours. `docs/screen.md` is why.
hypridle
hyprsunset

# How hard the machine is allowed to work. The Battery tab reads and sets the
# platform profile through `powerprofilesctl`, and the daemon is what holds that
# answer across a reboot and hands it to the firmware.
power-profiles-daemon

# Installing things, which the person using it does herself.
#
# pamac is the shop: one search box over the repositories and Flathub at once,
# categories to walk through without typing anything, and rows big enough for
# a thumb. flatpak is the other half of that search box, and the applications
# a person actually asks for are mostly there rather than in a repository.
#
# The polkit agent is the box that asks for the password when the shop is
# ready to commit. polkitd asks the session for one and gives up if nothing
# answers, so without an agent installing is not a wrong password, it is a
# button that does nothing and says nothing about why.
#
# pamac itself is in machines.conf, with the one other package no plain Arch
# machine can be handed: it is not in any repository this desktop can count on,
# and pacman told to install a name nothing carries stops the whole apply. The
# argument is there and what it wants instead is in the backlog.
flatpak
polkit-kde-agent

# What she asked for by name.
#
# librewolf is the browser this desktop dresses. The profile under [files] is
# written for it, so it comes up wearing the palette on its first run instead
# of the cold gray a browser picks for itself. Firefox is on the machine
# because CachyOS put it there; it is left in its own clothes.
#
# freetube is YouTube without the site around it, which is worth more on a
# screen this size than on a desk. It is in machines.conf, for the reason pamac
# is: nothing outside that machine's repositories carries it.
#
# The weather is this desktop's own, `forecast-panel`, and no package names it.
# gnome-weather was tried first and could not be used at all: it searches for a
# city in a GTK popover, and a popover's grab breaks on any tap on another
# surface, the on-screen keyboard included. kweather came next and worked, and
# was one more app in another toolkit's clothes asking the same service the
# wallpaper already asked. The panel asks it once, through the same crate, for
# a place the machine already knows rather than a city typed in.
#
# The add-ons the browsers are given are named in crates/console-default-applications rather
# than in this file. They are written into a policy under /etc instead of being
# installed, and `console apply` says them again every time. Bitwarden is one,
# because every password on this device is typed with a thumb, and Dark Reader
# is the second, because a page that is not dark is the one bright thing left on
# the machine. The third is this desktop's own: crates/console-browser-extension is the pad in
# a page, packed during an apply and named off the disk rather than off the net.
# docs/browser.md is what it does.
#
# chromium is the second engine, kept for the site that will not work in the
# first one. It wears its own colors: Chromium has no equivalent of the
# stylesheet a profile here can be given, and a browser that is opened when
# the other one has failed is not worth a theme it cannot read.
chromium
librewolf

# Talking to people, and handing a file to another machine.
#
# signal-desktop is the phone's conversations on a screen big enough to type
# on. It links to the phone once, over a code shown here and photographed
# there, and holds nothing until it has.
#
# localsend moves a file between this and whatever else is on the same
# network: no cable, no account, and nothing leaving the house. A picture for
# the wallpaper settings arrives that way rather than over ssh from someone
# else's machine.
#
# syncthing is the same folder on this device and on the machines it is paired
# with, kept in step while no one is looking: what a phone takes today is on
# the desk tonight without either end being asked. There is no window, only a
# service and a page it serves at 127.0.0.1:8384, which is what the entry under
# [files] opens. ~/Shared/Documents and ~/Shared/Pictures are offered to every
# machine it is paired with, by the script its unit runs once it is up.
localsend
signal-desktop
syncthing

# Drawing, with the pen held against the screen. Krita is the one painting
# program on Linux written for a tablet first, and the touchscreen reaches it
# as a pointer like anything else. It is a program this desktop runs and never
# asks anything of, so no crate names it.
krita

# What the Download panel fetches with. One program, asked for a list of what
# a name found and then for one thing off that list, and it is the only thing
# here that knows what a site calls a format. ffmpeg is the other half of it and
# is on the machine already, for the wallpapers: it is what unwraps the sound
# out of what arrives and puts the picture inside the file.
yt-dlp

# What puts the cover inside a song. yt-dlp does the picture with ffmpeg for a
# film and with this for an opus, and without it a fetched song arrives with no
# cover and a warning no one is standing in front of. It is an optional
# dependency of yt-dlp, which is to say it is not installed with it: the panel
# was written on a laptop that had it for some other reason, and the device did
# not, which is the shape of every dependency this file exists to catch.
python-mutagen

# What Unzip in the files panel runs. A mod arrives as an archive, always,
# and until now the only way to open one on this device was to reach it from
# another machine over ssh: ark is installed and is a pointer program, and a
# person holding the handheld has no pointer.
#
# One program rather than the three that would otherwise be named. unzip and
# unrar are both already on the machine and neither was ever asked for -- they
# arrived with something else, the way grim and libpulse did -- and a row whose
# answer depends on which of three programs a package upgrade leaves behind is
# a row that works until it does not. 7-Zip reads zip, rar and 7z itself, which
# is every shape a mod site ships, so the row is one variant of Program with
# one package under it.
#
# It is not offered over a `.tar.gz`, which unpacks into a `.tar` and would
# answer a press with another archive. `console_files::unzipping` is where the
# kinds are written down.
7zip

# Opening a link. xdg-open is what asks mimeapps.list which browser this
# desktop means, and the menu, the guide and the settings all ask it rather
# than each naming one.
xdg-utils

# The look: the background, and the icons the bar and the menu draw.
#
# awww and not hyprpaper. The backgrounds are hand-drawn loops that play for
# as long as nothing is in front of them, and hyprpaper paints one still image
# and nothing else. awww reads the frame durations out of the file and sleeps
# between them, so a picture handed a still is a process asleep in poll()
# rather than anything drawing, which is what makes it worth putting the still
# up the moment a window or a menu covers the wallpaper.
awww
papirus-icon-theme

# What makes a Qt program read the palette. There is no Plasma session on this
# machine, so Qt picks a platform theme of its own and never opens
# ~/.config/kdeglobals, which is the file this desktop writes its colors for
# Qt into. plasma-integration is the plugin that does open it, and
# QT_QPA_PLATFORMTHEME in hyprland.lua is what asks for the plugin by name.
# It was already installed as someone else's dependency, which is the thing
# this file is against: named here it is something the desktop is made of.
plasma-integration

# What the bar reads the machine with. Each is a command line onto something
# that is here anyway: wireplumber holds the sound, NetworkManager the network,
# bluez the bluetooth. They are named because the bar asks for them by name and
# a reading whose program is missing is an icon that says the wrong thing
# rather than one that says nothing.
bluez-utils
networkmanager
wireplumber

# How the Wi-Fi link is really doing, asked of the driver: the rate a frame
# comes in at, which is what a signal strength only hints at. console-wifi
# leaves a network by it. It was already here as someone else's dependency.
iw

# What a wallpaper is made out of. ffmpeg decodes someone else's loop, takes
# the grade this palette works out as a cube, and encodes the frames back. curl
# fetches the sources the picture table names, and asks what the weather is.
# Both are here because a picture she adds herself is pressed on the device,
# and a device that can only show the pictures it shipped with is not the offer
# the settings makes.
#
# ffprobe comes with ffmpeg, and is what `music-index` reads the library with:
# it is the one program here that knows where each of the nine kinds of file
# `music-player` plays keeps its title and whose the song is. ffmpeg is the
# other half of the player as well as the downloader's: a song is decoded by
# asking ffmpeg for plain samples and handing them to pw-cat, which is why
# nothing under [files] is a player any more.
curl
ffmpeg

# What every surface here is drawn with. There was a toolkit on this line --
# gtk4 and gtk4-layer-shell -- and what it actually contributed was these three
# and a second copy of every answer this tree had already given. cairo fills the
# rectangles, pango shapes and wraps the words, and libxkbcommon turns a
# keycode into the letter the compositor's own keymap says it is;
# `console-draw-painting` and `console-draw-surface` are the only crates that
# name any of them, and a layer over the desktop is four lines of
# `zwlr_layer_shell_v1` rather than a library.
#
# They were all three on every machine already, as gtk4's dependencies, which
# is why taking the toolkit out took nothing off the screen. They are named
# here now because nothing else asks for them.
cairo
pango
libxkbcommon

# What a photograph, a film and an icon are decoded with.
#
# This was six packages and a dependency chain nobody had asked for: gtk4
# pulled gdk-pixbuf2, which pulled glycin, which is the loader framework every
# picture on this desktop was actually read by -- the row squares, the
# thumbnails, the sleeve, the viewer -- with libheif beside it as an
# **optional** dependency, so the two types a phone camera writes decoded here
# and would not have decoded on a device rebuilt from this file. The gst-*
# four were the film half, and gst-plugin-gtk4 was where a decoded film was
# put, which was a widget.
#
# ffmpeg is all of it now, and it is named above for the player and the
# wallpaper anyway: it reads png, jpeg, webp, gif, tiff, avif and heif, it
# opens every container the viewer claims, and it scales while it reads. What
# it does not read is SVG, which is most of an icon theme, and librsvg is the
# library gdk-pixbuf was calling for that all along -- `rsvg-convert` draws one
# into a PNG and the same one path reads it. `console-pictures` is the only
# crate that runs either.
#
# shared-mime-info is the table that says what kind of thing a file is, by the
# name it has. gio answered that question for the files panel, the thumbnails
# and the viewer, and gio was reading this package's `globs2` to do it;
# `console-content-types` reads the same file. It arrives under glib2 today,
# which is exactly the sort of quiet dependency the line above is about.
#
# `crates/console-media-viewer/src/decoding.rs` says which type each of these is for,
# and a test crosses that table against this list both ways. A decoder named
# there and missing here is a file that will not open; a package here for a
# type nothing claims is a package no one can justify.
librsvg
shared-mime-info

# Moving a file to the wastebasket. The Files panel deletes with `gio trash`
# rather than by unlinking, so a delete on a machine with no second file
# manager on it is still something a person can take back an hour later. gio is
# glib2's, and glib2 was under every window here as GTK's foundation, which is
# exactly why nothing noticed it had never been asked for. The toolkit is gone
# and this is not: pango is glib2's too, and the wastebasket is still a
# question `gio` answers better than an unlink does.
glib2

# Speaking instead of typing. pw-record takes the microphone, whisper-cpp
# turns the recording into words and wtype writes them into whatever holds the
# focus, which together are what the bottom left paddle does. pw-record is
# pipewire-audio's, split out of pipewire, and this machine has had it all
# along for Steam rather than because anything said so. The model the hearing
# needs is a fifth of a gigabyte and is not a package: `console-dictate` fetches it
# once, into the home directory.
pipewire-audio
whisper-cpp
wtype

# And what it takes to make the hearing quick, which is a compiler.
#
# The packaged whisper-cpp speaks nothing but the processor. Reading a
# two-second sentence took nineteen seconds on it, by which time the box the
# words were meant for had been closed and they were typed into an empty
# desktop -- so the button looked broken while working perfectly. The same
# source pointed at this machine's own graphics does it in under one second.
#
# There is no build in any repository that knows about the card in this device,
# so the device makes that one program for itself, once, beside the model. See
# docs/voice.md. These are named here for the same reason everything else is:
# they are on the machine, and this file is what says what is on the machine.
#
# It is the only thing here built from someone else's source, and it is not a
# habit worth acquiring.
cmake
vulkan-headers
glslang
spirv-headers
spirv-tools

# What anything here says to someone who is not in a terminal. console-say
# and the dictation both speak through notify-send, and neither is worth the
# thing that called it, so both go on without it. A desktop that says nothing
# when it fails is the fault it cannot report.
#
# libnotify is only the half that speaks. Something has to own
# org.freedesktop.Notifications and hear it, and for a year nothing here did:
# the only file claiming the name was KDE's, which arrived under the login
# manager and cannot start on this compositor, so every notification on the
# machine waited fifty seconds for a service that was never coming and then
# failed. Not one fault ever reached the screen.
#
# mako was the half that heard, and console-notify is now: the card is a layer
# surface drawn out of the same palette as every other surface here, by a
# program that can be asked what it would do without a bus. So the package goes
# and libnotify stays -- what raises a notification on this machine is still
# notify-send, because the thing worth owning was the answering rather than the
# asking.
libnotify

# The letters. Everything here is set in Noto Sans, and the on-screen keyboard
# has a Thai layer: without the fonts behind it a Thai key is an empty box,
# on the keyboard and again in whatever she typed it into.
noto-fonts

# The icons. Every glyph on the bar -- the menu, the keyboard, the five
# readings, the bell, the music -- is a Material Design codepoint up in the
# private use area, and Noto Sans has none of them. It was never named here,
# so the bar drew its whole face out of a font that was on the machine by
# luck, and fontconfig picked whichever installed Nerd Font answered first.
#
# The bar asks for the Mono cut by name, and the reason is the cut rather than
# the taste: in the others these glyphs overflow their advance and are anchored
# to the left of it, so each one sits a different distance off center. Mono is
# the cut where they are drawn centered in one cell.
ttf-fantasque-nerd

# What this machine builds its own programs with. Nothing compiled is kept in
# the repository: the source is here and the device makes the program, so the
# manifest stays the whole truth about what is installed.
rust

# What the device does with the tree it holds. /etc/console is a clone that
# shares this history, and `console save` takes a file edited on the machine
# back into it by committing it there, so the device keeps its own record of
# what was changed on the device. git is on it as a dependency of the shop,
# which would leave saving a file resting on pamac staying installed.
git

# What carries a change the session is not allowed to make. The settings panel
# sets the browser's search engine through `sudo -n console-engine`, which
# writes a policy file under /etc, and the rule letting that through without a
# password is the sudoers file named under [files]. sudo is on every machine
# anyone has ever used, and is named here because that is a habit and not a
# dependency.
sudo

# What makes an apply something a machine can come back from. The root
# filesystem is btrfs and this device already keeps snapshots -- one
# configuration for `/`, one for `/home`, and `snap-pac` brackets every pacman
# transaction with a pair -- so `console apply` takes a mark of its own before
# it rewrites anything and another when it reaches the end. It is named here
# because the apply now runs it, and a device rebuilt from this manifest that
# did not have it would install exactly as far and promise a previous it does
# not have.
#
# What makes those snapshots reachable from a machine that will not come up is
# the bootloader's side of it, and that is not named here yet: see the rollback
# entry in the backlog.
snapper


[build]
# The programs this device compiles for itself, each a crate under crates/ and
# each installed into /usr/local/bin under its own name.
#
# The engine is the first of them, and it is the one the manifest could not
# list while it was a script: a program that copies over the file it is being
# read from can be halfway through itself when it changes. A compiled program
# is not read as it runs, and `console apply` replaces a name rather than a
# file, so the engine can now be installed by itself like anything else.
#
# The rest are what a person actually touches: the menu, the files, the guide,
# the settings, the button that puts away whatever is up, and the daemon that
# reads the pad behind all of them. They share one crate for the panel they
# are drawn as, which is why the guide cannot say a button does something the
# daemon does not do.
#
# The small ones with plain names were shell scripts, and each held a decision
# that could only be asked by running it on the machine it decides about:
# whether a fault has been shown often enough, what full means on this
# backlight, whether turning the volume up should unsilence it, whether a
# button held a moment too long should do anything twice. Compiled, all of that
# is asked on a laptop, and a program a crate runs is a variant of
# `console_core_external_programs::Program`, which names the package it comes from
# -- which is how grim came to be listed at all.
#
# Most of them are not programs anyone types, and the names say which is
# which. A command is typed and opens with `console-`; a part is started by a
# unit, by the bar's configuration, by a keybinding or by another program of
# ours, and opens with a word its own crate's name holds. So this list sorted
# is `ls crates/` sorted, and a name says where to open it.
# `console-manifest-engine/tests/the_binaries.rs` holds that and docs/rename.md
# section 6 argues for it.
#
# `console-panels` is the one part that is not a part of anything above it. It
# stays up and holds the toolkit so a panel opening does not have to raise one,
# and every panel binary here is a stand-in that asks it and draws the card
# itself when it cannot be reached. That is why the list is unchanged by it --
# a road into a panel still names the panel.
bookmarks-index
books
books-catalog
calculator
calendar-panel
console
console-asking
console-bar
console-battery
console-bluetooth
console-brightness
console-browser
console-buttons
console-confirm
console-control-center
console-dictate
console-engine
console-events
console-home
console-keyboard
console-machine
console-notify
console-panels
console-point
console-put-away
console-report-crash
console-response-times
console-resource-usage
console-resume
console-say
console-scale
console-screenshot
console-sound-effect
console-tap
console-updating
console-volume
console-wallpaper
console-warm
console-web
console-wifi
controller-desktop
controller-game
controller-profile
downloads
downloads-find
downloads-format
downloads-get
files
files-thumbnails
files-unzip
forecast-panel
home-square
keyboard-show
keyboard-toggle
language-switch
launcher
login-greeter
login-window
mapping-panel
music
music-bar
music-index
music-onward
music-panel
music-player
notifications-panel
panel-pictures
recovery
session-desktop
session-game
session-start
settings-login-pattern
settings-panel
viewer
wallpaper-render


[files]
# The way in. A session entry is what a login manager offers, so this is the
# line between a machine this desktop *is* and a machine it is one of the
# choices on -- and until it existed there was no second kind. The device
# logged in through the hyprland package's own entry, which runs the compositor
# with no argument and so reads whatever is in ~/.config/hypr, and that is the
# one directory on a machine with another Hyprland desktop on it that is
# certainly already taken. On this laptop omarchy's hyprland.lua and
# hypridle.conf are sitting in it.
#
# So the three files below moved into this desktop's own directory and the
# session names the one the compositor cannot find by itself. The other two are
# found by XDG_CONFIG_HOME, set in the units that start them -- hyprsunset has
# no way to be told a path, which settles the shape for both.
#
# It is the package's `start-hyprland` and not `Hyprland`, because that is what
# the hyprland entry beside it runs: the watchdog is how a compositor that dies
# is restarted rather than a session that ends, and anything after `--` is
# handed on.
/usr/share/wayland-sessions/console.desktop

# The compositor. Everything else is started by the target, not from here.
/home/@user@/.config/console/hypr/hyprland.lua
/home/@user@/.config/console/hypr/hypridle.conf
# The color of the screen through the evening, which hyprsunset reads once
# when it starts. Written by `console-warm curve` out of
# `console_settings::warm` rather than by hand, and a test holds the two
# together.
/home/@user@/.config/console/hypr/hyprsunset.conf
/home/@user@/.config/console/palette.css
/home/@user@/.config/console/palette.toml
# The processors sleep between presses, so the daemon that reads the pad tells
# them to hurry as it opens a panel and puts back what was there a moment
# later. This rule is what lets it: the hint belongs to root, and this hands
# one to each processor's own file. See `console_haste`. Every machine has
# processors that do this; what is in machines.conf is the pad that asks.
/etc/udev/rules.d/93-console-cpufreq.rules

# The palette the keyboard is drawn out of, and the two ways of asking for the
# keyboard itself. `keyboard-toggle` is the button's -- one press up, the next
# press away. `keyboard-show` only ever shows, because a program asking on
# someone's behalf is asking for a keyboard rather than for the other side of
# a switch: the browser's search card wants one up and would otherwise put one
# away by asking while it was.
#
# The keyboard itself is no longer here: it was a compiled C program carried in
# the tree and it is now Rust in [build], like everything else a person
# touches. What it types is not carried either -- `keymap` composes each
# alphabet from the system's own xkb symbols, so a language is a word on the
# command line below and not a table in this repository.
#
# Both of those are in [build] now, and were the last two shell scripts here
# that were ours. What each one is remains one line; what it is worth having
# compiled is that the line is now held by a test rather than by a comment --
# `keyboard-show` quietly becoming a toggle is what would put the browser's
# keyboard away, and nothing could have said so before.
/usr/local/lib/console/palette.sh

# The menu, and the picker the battery icon opens. The menu's "Buttons" is
# the guide to what every button does and the place it is changed, one panel;
# the Menu button opens the same one.
/usr/share/applications/console-music.desktop
/usr/share/applications/console-notifications.desktop
/usr/share/applications/console-buttons.desktop
/usr/share/applications/console-input-dictation.desktop
/usr/share/applications/console-downloads.desktop
/usr/share/applications/console-files.desktop
/usr/share/applications/console-forecast.desktop
/usr/share/applications/console-syncthing.desktop
/usr/share/applications/console-media-viewer.desktop
/usr/share/applications/console-books.desktop
/usr/share/applications/console-calculator.desktop
/usr/share/icons/console-placeholder.svg

# The one thing the panel does as root. Choosing a search engine writes it into
# every browser, and all three read their policy out of /etc, so console-engine
# is run through sudo and this is the rule that lets it be.
/etc/sudoers.d/console

# The radio stays off until someone asks for it. bluez has no drop-in
# directory, so the one thing this machine decides about Bluetooth is decided
# in a file bluez otherwise owns.
/etc/bluetooth/main.conf

# The other thing this machine decides about sound, and it is about a name
# rather than about a device. wireplumber remembers a stream's volume and mute
# under the first name the stream carries -- application.id, then
# application.name -- and every Electron program here carries the same one,
# Chromium. So the mute on FreeTube's row in Settings, Sound was Signal's mute
# too, and was put back on both at every launch by a file in
# ~/.local/state/wireplumber that nothing on screen mentions: video playing and
# no sound, for as long as someone was willing to go and read it.
#
# wireplumber's own script asks each stream whether its properties are worth
# keeping, so this answers no for the streams whose name is not theirs. A mute
# on one of them now lasts as long as the program does, which is what a row
# that disappears with the stream looks like it means. The row for a stream
# that is not playing is the other half and is not here.
/home/@user@/.config/pipewire/pipewire-pulse.conf.d/console-electron.conf

# Where flatpak looks. A remote added by hand is a remote that exists because
# someone once ran a command, which is the thing this file is against; named
# here it is a file, and a machine put back together from the manifest has
# somewhere to install from. Pamac's own settings say to search it.
/etc/flatpak/remotes.d/flathub.flatpakrepo
/etc/pamac.conf

# Who answers when something raises a notification. This file is what takes
# org.freedesktop.Notifications off KDE's copy of that name: plasma-workspace
# cannot be removed, because cachyos-handheld wants the login manager and the
# login manager wants it, so the name is taken instead. /usr/local/share comes
# before /usr/share in XDG_DATA_DIRS, which is the whole of why this wins.
#
# There is no configuration file beside it any more. What a card looks like is
# console-notifications::showing, which the stylesheet is written out of, and
# what it says is console-notifications::serving.
/usr/local/share/dbus-1/services/org.freedesktop.Notifications.service

# The look, as far as it reaches from here: the background and the browser's own
# profile. The terminal, GTK and Qt are in machines.conf, and the argument for
# the line between them is there -- what is here is what this desktop writes in
# a directory of its own, and what is there is what it writes in someone
# else's.
# The garden. Not the background any more, which is a picture from
# theme/sky.toml; kept because it is the one wallpaper here that is ours and
# `awww img` still paints it by hand. Nothing draws it now -- the program that
# did is in the history -- so it is a fixed picture like the rest.
/usr/share/backgrounds/console.webp
/home/@user@/.librewolf/console/user.js
/home/@user@/.librewolf/console/chrome/palette.css
/home/@user@/.librewolf/console/chrome/userChrome.css
/home/@user@/.librewolf/console/chrome/userContent.css

# Nothing on this machine animates. Hyprland, GTK, Qt and the browser are each
# told separately, because each keeps its own idea of it. The boot splash is the
# fourth and is not here: an initramfs belongs to whatever put this machine
# together, so the hooks are in machines.conf under the machine whose initramfs
# this desktop is the whole of.
#
# The backlight is handed to the session by the rule below, and finding which
# backlight is `console_settings::screen`.
/etc/udev/rules.d/90-console-backlight.rules

# And the one the controller daemon cannot start without. It publishes a pointer
# through /dev/uinput, which belongs to root and the input group, so on a machine
# where the person is not in that group the daemon exits as it starts -- and with
# it go the keyboard binds, which that same process hands to the compositor. The
# module is loaded at boot so that the node arrives as an event a rule can act
# on; the rule and the file each carry the rest.
/etc/modules-load.d/console-uinput.conf
/etc/udev/rules.d/94-console-uinput.rules

# The units. One target pulls in the services the desktop is made of, and the
# compositor starts that target and nothing else.
#
# The drop-in is one file for every one of them: systemd reads a directory named
# for a unit's prefix, so console-.service.d belongs to every console service
# there is. It takes off the start limit, without which all of them stop
# restarting after five falls -- which is the one fault they are meant to
# survive, arriving at the one moment they are least able to.
/etc/systemd/user/console.target
/etc/systemd/user/console-.service.d/restarting.conf
# The second prefix drop-in, and the same argument for being one file: what a
# program of ours may reach is one decision. It is the floor, and each unit
# below adds the two or three doors its own program actually needs -- the pad,
# the home directory, the weather. A unit that starts a program someone chose
# takes it all back off again and has a drop-in of its own saying why, because
# a scope does not escape the unit that started it.
/etc/systemd/user/console-.service.d/confining.conf
/etc/systemd/user/console-bar.service.d/opening.conf
/etc/systemd/user/console-input-controller.service.d/opening.conf
/etc/systemd/user/console-home.service.d/opening.conf
/etc/systemd/user/console-panels.service.d/opening.conf
/etc/systemd/user/console-session.service.d/opening.conf
# Asked a few minutes after the desktop comes up and hourly after that: is this
# machine what the manifest says, and is every piece of it up. The service has
# no [Install] -- the timer is what pulls it in -- so only the timer is enabled.
/etc/systemd/user/console-health.service
/etc/systemd/user/console-health.timer
# A reading of what the machine is spending, every few minutes, kept where
# anything can read it back. Same shape as the check above and for the same
# reason: the service has no [Install] and the timer is the only thing enabled.
/etc/systemd/user/console-resource-usage.service
/etc/systemd/user/console-resource-usage.timer
/etc/systemd/user/console-input-controller.service
/etc/systemd/user/console-input-keyboard.service
/etc/systemd/user/console-bar.service
/etc/systemd/user/console-control-center.service
/etc/systemd/user/console-notify.service
/etc/systemd/user/console-polkit.service
/etc/systemd/user/console-session.service
/etc/systemd/user/console-paper.service
/etc/systemd/user/console-events.service
/etc/systemd/user/console-panels.service
/etc/systemd/user/console-wallpaper.service
/etc/systemd/user/console-home.service
/etc/systemd/user/console-idle.service
/etc/systemd/user/console-warm.service
/etc/systemd/user/console-light.service
/etc/systemd/user/console-wifi.service
/etc/systemd/user/syncthing.service
/usr/local/bin/syncthing-shared-folders



[services]
# Enabled for the desktop user, and pulled in together by console.target. Each
# restarts itself, so losing a piece costs seconds rather than the session.
console-input-controller.service
console-input-keyboard.service
console-bar.service
console-control-center.service
console-notify.service
console-polkit.service
console-session.service
console-paper.service
console-wallpaper.service
console-events.service
console-panels.service
console-home.service
console-idle.service
console-warm.service
console-wifi.service
# The one that is inactive on almost every machine, and says so rather than
# failing: it asks its own ExecCondition whether there is a light sensor to
# follow before it starts anything.
console-light.service

# The timer and not the service. It pulls its oneshot in a few minutes after
# the desktop comes up and every hour after that, and asks whether this machine
# is still what the manifest says and whether every piece of it is up. Enabling
# the service instead would mean a oneshot that is `inactive` between runs
# sitting in this list, which is a unit `console health` would find down and
# raise a card about -- the fault-finder reporting itself.
console-health.timer

# The other timer, and the same argument about which half is enabled. It takes
# one reading of the battery, the power and what has been holding the CPU, every
# five minutes, and writes a line under the home directory. Nothing reads it on
# a schedule: a reading is worth having because the question is always asked
# afterwards, about a window no one could have known to stand over at the time.
console-resource-usage.timer

# The one that is not on the screen. Syncthing is carried here as a unit of
# ours like the rest, because what runs on this machine is decided in one place,
# and the unit its own package ships is wanted by a target this desktop never
# starts.
syncthing.service


[masked]
# mako's own unit, which declares the same BusName as ours.
#
# A user manager lets one unit watch a bus name. The second to load is refused
# with EEXIST, and what that looks like is not a message anyone sees: the
# refused unit is `LoadState=error` and simply never runs. Units under /usr/lib
# are loaded first, so mako's won, and console-notify.service was dead on this
# machine from the day it was written while notifications went on reaching the
# screen -- because the package's unit was running the same mako and holding
# the same name. `console check` counted it as one difference among fifty
# lines of ok.
#
# mako has left [packages] and this line stays, which is the shape of every
# removal here: an apply installs a name and has never removed one, so a device
# that applied any earlier commit still has the package and still has that
# unit. Masked, it cannot take the name from console-notify.service; on a
# machine that never had mako the mask is a symlink to /dev/null for a unit
# nothing was going to load anyway.
mako.service


[elsewhere]
# One program this desktop is made of, which this repository does not carry.
#
# It is a fork of someone else's work, kept on the machine as a built program,
# and publishing a binary means publishing the source that made it. That source
# is upstream's rather than ours, so the binary is left out rather than
# published without it.
#
# papers/forks.md says what it is, what the fork changes, and how to build it.
# Build it, put it at the path named here, move that line up into [files], and
# apply will carry it.
#
# Listed rather than left out, so that a unit starting a program nothing
# installs stays the failure it should be everywhere else.
#
# There were two. The session keeper was the other, and it stopped being a
# binary: its source is `crates/console-resume` and the copy carries it like any
# other crate, which is what a fork ported into this workspace ought to be.
/usr/local/bin/kew
