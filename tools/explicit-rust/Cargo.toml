[workspace]
members = ["explicit001_fallible_result", "explicit002_infallible_result", "explicit003_no_never_error", "explicit004_no_panic", "explicit005_handle_fallible", "explicit006_option_not_error", "explicit007_no_bool_return", "explicit008_no_bool_param", "explicit009_explicit_discard", "explicit010_no_numeric_into", "explicit011_no_as_cast", "explicit012_safety_doc", "explicit013_breathing_room", "explicit014_no_index_slice", "explicit015_no_bare_arithmetic", "explicit016_no_wildcard_arm", "explicit017_question_mark_alone", "explicit018_allow_with_reason", "explicit019_no_if", "explicit020_no_comment", "explicit021_no_sleeping", "explicit022_no_settling", "explicit023_no_let_else", "explicit024_no_swappable_params", "explicit025_no_sentinel_value", "explicit026_env_read_once", "explicit027_no_needless_collection", "explicit028_no_search_in_a_loop", "explicit029_no_asking_per_item", "explicit030_no_copy_to_lend", "explicit031_no_walking_by_count", "explicit032_no_counting_to_ask", "explicit033_no_unnamed_absence", "explicit034_no_unclaimed_answer", "explicit035_no_loose_thread", "explicit036_no_program_by_name", "explicit037_no_native_byte_order", "explicit038_no_prose_fault", "explicit039_no_reading_the_clock", "explicit040_no_torn_write", "explicit041_no_unsaid_printing", "explicit042_no_leaving_early", "explicit043_no_unmatched_listen", "explicit044_no_ambient_value", "explicit045_no_unnamed_conversion", "explicit046_no_unnamed_jump", "explicit047_no_captured_permission", "explicit048_no_unreal_state", "explicit049_no_recursion", "explicit050_no_long_function", "explicit051_no_machine_width", "explicit052_no_libc", "architecture_facts"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0"
dylint_testing = "6.0"