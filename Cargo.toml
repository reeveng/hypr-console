# Every program on this device, in one workspace.
#
# The device builds these itself: `rust` is in desktop.conf's [packages] and
# `console apply` runs cargo before it installs. So the manifest stays the whole
# truth about the machine, nothing compiled is kept in git, and the public copy
# of this repository is source and nothing else.

[workspace]
members = ["crates/*"]
# The lint suite is a workspace of its own, on a nightly of its own.
exclude = ["tools/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
console-applications = { path = "crates/console-applications" }
console-input-mapping = { path = "crates/console-input-mapping" }
console-program-lifetime = { path = "crates/console-program-lifetime" }
