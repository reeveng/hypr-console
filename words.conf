[what a call is handed]
# EXPLICIT044 says a function decides from what it was handed and EXPLICIT047
# says the same of a closure, so "hand it in" is the answer this tree gives at
# every site either rule finds. The functions that take a closure and hand it
# nothing each have a second spelling saying so in their name -- a wait, a
# stretch of an apply, the sentence a failed check prints, the line a run draws
# quietly -- and the parameter carries the same word, so a reader meeting
# `until_handed` in one crate has already met it in another.
#
# `arguments` is here for the same reason and was `argv` until it was written
# out: what a program is started with is handed in at `main` and read nowhere
# else, so every program in this tree says the word once at the top and again
# at each call that passes it on. `operands` and `subcommands` are POSIX's and
# git's words for what else comes after a program's name besides its flags,
# and `console-core-arguments` reads both for every program that takes either.
# A `refusal` is what that reading answers instead of a line it cannot read:
# the reason and the usage under it, which every `main` prints and exits on.
arguments
handed
invocation
operand
operands
refusal
subcommands
endpoints
lendable

[state machines]
# effect's experimental `Machine` module, which vocabulary.conf chose: a machine
# is initialized, an actor is booted, and a machine that can be saved is
# serializable. Every machine on this desktop is written in these words, so
# they are written far more often here than English writes them anywhere. A
# machine is tested against every interleaving of what can reach it, the
# orders two producers that each keep their own order can be heard in.
booted
initialized
interleavings
serializable

[work that runs later]
# effect's `fork` and `interrupt`, which vocabulary.conf chose: what may take
