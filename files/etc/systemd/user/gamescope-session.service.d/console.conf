# The one piece of this desktop that goes on running while Steam has the
# screen: the left Legion button, held, comes back here.
#
# Wanted from the Game Mode session rather than enabled for the user, because
# what starts it has to be Steam arriving and what stops it has to be Steam
# leaving. Enabled for the session it would also run on the desktop, reading
# the pad behind the daemon that already reads it there, and the two of them
# would answer the same button twice.
[Unit]
Wants=console-return.service

# Game Mode, told to be the compositor rather than a window in one.
#
# gamescope picks its backend off the environment: with WAYLAND_DISPLAY set it
# opens as a client of whatever that names. The name this desktop leaves in
# the user's manager on the way out is its own, and by then the socket behind
# it is gone, so Game Mode failed to open, the display manager started it
# again, and the machine sat in that loop. What is set here is nothing; what
# matters is what is taken away.
[Service]
UnsetEnvironment=DISPLAY HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY
