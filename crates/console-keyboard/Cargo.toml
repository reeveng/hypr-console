[package]
name = "console-keyboard"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"

# The on-screen keyboard. The palette binding is `palette`.
#
# The one crate here that does not say what the workspace says. It is a port
# of wvkbd, which is GPL-3.0-or-later, and a later version of the GPL is the
# only thing that permission reaches -- the AGPL is a different licence and
# not ours to move somebody else's work under. `src/lib.rs` is the rest.

[lib]
name = "console_keyboard"
path = "src/lib.rs"

# The keyboard itself, and the only program here. Named for what the desktop
# looks for: `keyboard-toggle` matches this path, the unit runs it directly, and
# `console_controller::mode::KEYBOARD` is the namespace it publishes.
#
# It ran behind a starter that read the palette and exec'd it, from when this
# was C and could not be handed a Rust crate to ask. Both ends being Rust, the
# starter was one program naming another, which is the shape `named_by` cannot
# see through: the unit named the starter, so a rebuilt keyboard did not restart
# the unit and the device went on running the one before it.
[[bin]]
name = "virtual-keyboard"
path = "src/bin/keyboard.rs"
required-features = ["port"]

# The two ways anybody outside asks for the keyboard, which were the last two
# shell scripts in `files/usr/local/bin` that were ours. Deliberately not behind
# `port`: they signal a process by path and never draw anything, so a machine
# that could not build a compositor client can still put the keyboard up.
[[bin]]
name = "keyboard-toggle"
path = "src/bin/toggle.rs"

[[bin]]
name = "keyboard-show"
path = "src/bin/show.rs"

# The runtime, and the only thing that asks for its dependencies.
#
# On by default now, because the device runs it: it was off while this was a
# port catching up with a C program, and cairo, pango and xkbcommon had no
# business being built on a handheld for a program it did not start. It does
# now, and the first build after the switch pays for all of them at once.
#
# Still a feature rather than nothing, because the palette binding is a library
# and answers without a compositor: `tests/the_keyboard_colours.rs` asks which
# colour every key is against the palette this repository spends, and that
# question has no business pulling in cairo, pango and a Wayland client to be
# answered.
[features]
default = ["port"]
port = [
    "dep:console-gamepad",
    "dep:console-input-claim",
    "dep:console-wait-times",
    "dep:evdev",
    "dep:libc",
    "dep:xkbcommon",
    "dep:cairo-rs",
    "dep:pango",
    "dep:pangocairo",
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "dep:wayland-protocols-misc",
]

[dependencies]
console-number-conversion.workspace = true
# The palette that the binding reads and the runtime will eventually spend
# directly. The one dependency that is not the runtime's.
console-colour.workspace = true
# What a program is, and the loop that carries out what one decided. The two
# asking programs above are the whole of what this is for here; the keyboard
# itself has its own loop, because a Wayland client is one.
console-program-contract.workspace = true
console-program-runtime.workspace = true
# `pkill`, named rather than spelled.
console-external-programs.workspace = true
# The error of a program that cannot have one of its own.
console-never.workspace = true

# Everything below is the port's, and is compiled only with `port`. This
# workspace is Linux-only, so none of it is written behind a target cfg as
# well: a second condition on the same fact is a second thing to keep true.
#
# Which button is which. `vocabulary` is the one place that says the button
# labelled X is BTN_NORTH, and it is shared with the daemon rather than written
# twice. This crate does not depend on `console-controller` and must not: the
# daemon stands down for the keyboard -- `mode::Mode::Keyboard` -- and a
# keyboard that reached through it would point that dependency backwards.
console-gamepad = { workspace = true, optional = true }
# The pad and the keyboard InputPlumber publishes beside it, taken for as long
# as this keyboard is on the screen and handed back when it goes. One crate
# because three programs here want the same thing and each used to take it a
# different way; `console_input_claim`'s own prose is the argument, and finding
# the devices is its job now rather than this one's.
console-input-claim = { workspace = true, optional = true }
# How long the keyboard kept somebody waiting: coming up with the session, and
# every time it is asked onto the screen. It is the one surface here that is not
# GTK, so `console_panel::opening` -- which times every other surface without
# anybody remembering to -- does not reach it and it says so itself.
console-wait-times = { workspace = true, optional = true }
# The axis and event types the claim hands back. The devices themselves are
# opened by the claim; this is the vocabulary for reading what comes out.
evdev = { version = "0.13", optional = true }
# memfd_create for the keymap fd, and errno for the failure messages.
libc = { version = "0.2", optional = true }
# Compose a keymap from the system's installed languages. xkbcommon has every
# alphabet X11 ships symbols for, so a Thai layer shows up because `th` is in
# /usr/share/X11/xkb/symbols/, not because the keyboard shipped 12330 lines of
# keymap data.
xkbcommon = { version = "0.9", optional = true }
# Cairo and Pango for the drawing. The C version writes pixel by pixel through
# Cairo's image surface, and these let the port keep that shape in safe types.
cairo-rs = { version = "0.22", optional = true }
pango = { version = "0.22", optional = true }
# pangocairo is the bridge between the two: `pango_cairo_show_layout` in the C
# version is `pangocairo::show_layout` here.
pangocairo = { version = "0.22", optional = true }
# The compositor. `main.c` writes the protocol by hand against the C bindings
# and carries the generated headers for three protocols with it; these are the
# same protocols, generated at build time from the same XML, with the object
# lifetimes in the type system instead of in the reviewer's head.
wayland-client = { version = "0.31", optional = true }
# The layer shell, which is what makes a surface a keyboard rather than a
# window: it is anchored to the bottom of the screen, it is not in the tiling
# layout, and it is what `console_door` sees when it asks the compositor
# whether the keyboard is up.
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# `zwp_virtual_keyboard_v1`, which is the whole reason this is not a uinput
# device: a client of it uploads its own keymap, so the alphabet the keyboard
# types is the keyboard's to choose rather than the one the compositor was
# configured with. `keymap` is where that keymap comes from.
wayland-protocols-misc = { version = "0.3", features = ["client"], optional = true }

[dev-dependencies]
# The namespace the keyboard publishes has to be the one the daemon looks for.
# `tests/the_namespace.rs` holds the two together.
console-controller.workspace = true

[lints]
workspace = true
