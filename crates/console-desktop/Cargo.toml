[package]
name = "console-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_desktop"
path = "src/lib.rs"

# Not a program on the device. It runs the device's desktop on a machine that
# is not the device, which is a thing only somebody working on it wants.
[[bin]]
name = "console-desktop"
path = "src/main.rs"

[dependencies]
console-screen.workspace = true
console-stage.workspace = true
libc = "0.2"
serde_json = "1"
