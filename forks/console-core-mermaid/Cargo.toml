[workspace]
resolver = "2"
members = [
    "crates/merman",
    "crates/merman-analysis",
    "crates/merman-editor-core",
    "crates/merman-fixture-render-context",
    "crates/merman-theme-authoring-fixtures",
    "crates/merman-theme-contract",
    "crates/merman-theme-acceptance",
    "crates/merman-core",
    "crates/merman-model",
    "crates/merman-markup",
    "crates/merman-doc",
    "crates/merman-ascii",
    "crates/merman-ascii-test-contracts",
    "crates/merman-bindings-core",
    "crates/merman-android-jni",
    "crates/merman-cli",
    "crates/merman-lsp",
    "crates/merman-ffi",
    "crates/merman-elk-layered",
    "crates/merman-layout-elk",
    "crates/merman-rustdoc",
    "crates/merman-render",
    "crates/merman-unicode-linebreak",
    "crates/merman-export",
    "crates/merman-typst-plugin",
    "crates/merman-uniffi",
    "crates/merman-wasm",
    "crates/merman-wasi",
    "crates/dugong",
    "crates/dugong-graphlib",
    "crates/manatee",
    "crates/roughr",
    "crates/xtask",
    "distribution/tree-sitter-mermaid",
]
exclude = [
    "repo-ref/dear-imgui-rs",
    "repo-ref/mermaid-rs-renderer",
]

[workspace.package]
version = "0.10.0-alpha.2"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/merman"
homepage = "https://github.com/Latias94/merman"
rust-version = "1.95"

[workspace.metadata.merman-release]
independent-packages = ["roughr-merman", "tree-sitter-mermaid"]

[workspace.dependencies]
atomic-write-file = { version = "0.3.1", default-features = false }
base64 = "0.23.1"
data-url = { package = "console-core-data-urls", path = "../console-core-data-urls" }
brotli = "9.1.1"
clap_mangen = "0.3.3"
ctrlc = "3.5.2"
data-encoding = "2.11.1"
euclid = "0.22.14"
flate2 = "1.1.10"
fontique = { version = "0.12.0", default-features = false, features = ["system"] }
fs2 = "0.4.3"
htmlize = { version = "1.1.0", features = ["unescape"] }
html5ever = "0.40.1"
indexmap = "2.14.2"
lalrpop = "0.23.2"
lalrpop-util = { version = "0.23.2", default-features = false }
libc = "0.2.191"
# Pin numerical kernels so deterministic geometry changes are reviewed explicitly.
libm = { version = "=0.2.16", default-features = false }
pulldown-cmark = { version = "0.13.6", default-features = false }
ratex-font = "0.1.15"
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", default-features = false }
ratex-types = "0.1.15"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "default-tls"] }
rayon = "1.12.0"
roxmltree = { package = "console-core-extensible-markup", path = "../console-core-extensible-markup" }
quick-xml = "0.42.0"
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
rustc-hash = "2.1.3"
rustybuzz = "0.20.1"
unicode-script = "0.5.9"
ryu-js = "1.0.3"
roughr = { package = "console-core-mermaid-sketches", path = "crates/roughr", version = "0.12.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
same-file = "1.0.6"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }
sha2 = "0.11.1"
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
tokio = { version = "1.54.1", default-features = false }
granit-parser = { version = "2.1.0", default-features = false, features = ["error_messages"] }
serde-saphyr = { version = "2.1.1", default-features = false }
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }
serde_json_canonicalizer = "0.4.1"
json5 = "1.3.7"
jsonschema = { version = "0.60.2", default-features = false }
kurbo = "0.13.1"
js-sys = "0.3.107"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
uniffi = { version = "0.32.2", default-features = false }
futures = { version = "0.3.34", default-features = false }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std", "variable-fonts"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["equivalent"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "system-config"] }
url = "2.5.8"
cssparser = { version = "0.38.0", default-features = false, features = ["fast_match_byte"] }
jiff = { version = "0.2.39", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
console_error_panic_hook = "0.1.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
png = "0.18.1"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
getrandom = { version = "0.4.3", default-features = false }
resvg = { package = "console-core-scalable-vector-graphics-rasterizer", path = "../console-core-scalable-vector-graphics-rasterizer", default-features = false }
serde-wasm-bindgen = "0.6.5"
syn = { version = "3.0.9", features = ["full", "parsing"] }
usvg = { package = "console-core-scalable-vector-graphics", path = "../console-core-scalable-vector-graphics", default-features = false }
svgtypes = { package = "console-core-scalable-vector-graphics-values", path = "../console-core-scalable-vector-graphics-values" }
tiny-skia = { package = "console-core-path-rasterizer", path = "../console-core-path-rasterizer" }
krilla = { version = "0.8.2", default-features = false }
krilla-svg = { version = "0.8.1", default-features = false }
unicode-width = { version = "0.2.3", default-features = false }
unicode-linebreak = { package = "console-core-mermaid-line-breaks", path = "crates/merman-unicode-linebreak", version = "=0.10.0-alpha.2" }
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
unicase = "2.10.0"
wasm-bindgen = "0.2.130"
web-time = "1.1.0"
wasm-minimal-protocol = "0.2.1"
# Preserve Wasmi's automatic fallback to loop dispatch for unoptimized host builds.
wasmi = { version = "2.0.0", default-features = false, features = ["auto-dispatch", "simd", "stable", "validate"] }
windows-sys = { version = "0.61.2", default-features = false }
# The crate requires one transport runtime even when consumers only construct its LSP service.
tower-lsp-server = { version = "0.23.0", default-features = false, features = ["runtime-tokio"] }

# Workspace crates (publishable). Keeping versions explicit makes `cargo publish` work without
# duplicating version requirements across crates.
merman = { package = "console-core-mermaid", path = "crates/merman", version = "=0.10.0-alpha.2", default-features = false }
merman-analysis = { package = "console-core-mermaid-analysis", path = "crates/merman-analysis", version = "=0.10.0-alpha.2", default-features = false }
merman-ascii = { package = "console-core-mermaid-text", path = "crates/merman-ascii", version = "=0.10.0-alpha.2", default-features = false }
merman-bindings-core = { package = "console-core-mermaid-bindings", path = "crates/merman-bindings-core", version = "=0.10.0-alpha.2", default-features = false }
merman-core = { package = "console-core-mermaid-syntax", path = "crates/merman-core", version = "=0.10.0-alpha.2", default-features = false }
merman-model = { package = "console-core-mermaid-model", path = "crates/merman-model", version = "=0.10.0-alpha.2", default-features = false }
merman-markup = { package = "console-core-mermaid-markup", path = "crates/merman-markup", version = "=0.10.0-alpha.2", default-features = false }
merman-doc = { package = "console-core-mermaid-documents", path = "crates/merman-doc", version = "=0.10.0-alpha.2", default-features = false }
merman-editor-core = { package = "console-core-mermaid-editing", path = "crates/merman-editor-core", version = "=0.10.0-alpha.2", default-features = false }
merman-elk-layered = { package = "console-core-mermaid-elk-layered", path = "crates/merman-elk-layered", version = "=0.10.0-alpha.2", default-features = false }
merman-layout-elk = { package = "console-core-mermaid-layout-elk", path = "crates/merman-layout-elk", version = "=0.10.0-alpha.2" }
merman-ffi = { package = "console-core-mermaid-ffi", path = "crates/merman-ffi", version = "=0.10.0-alpha.2" }
merman-rustdoc = { package = "console-core-mermaid-rustdoc", path = "crates/merman-rustdoc", version = "=0.10.0-alpha.2" }
merman-render = { package = "console-core-mermaid-renderer", path = "crates/merman-render", version = "=0.10.0-alpha.2", default-features = false }
merman-export = { package = "console-core-mermaid-export", path = "crates/merman-export", version = "=0.10.0-alpha.2", default-features = false }
merman-typst-plugin = { package = "console-core-mermaid-typst-plugin", path = "crates/merman-typst-plugin", version = "=0.10.0-alpha.2" }
merman-uniffi = { package = "console-core-mermaid-uniffi", path = "crates/merman-uniffi", version = "=0.10.0-alpha.2" }
merman-wasm = { package = "console-core-mermaid-wasm", path = "crates/merman-wasm", version = "=0.10.0-alpha.2" }
merman-wasi = { package = "console-core-mermaid-wasi", path = "crates/merman-wasi", version = "=0.10.0-alpha.2", default-features = false }
merman-cli = { package = "console-core-mermaid-cli", path = "crates/merman-cli", version = "=0.10.0-alpha.2" }
dugong = { package = "console-core-mermaid-dagre", path = "crates/dugong", version = "=0.10.0-alpha.2" }
dugong-graphlib = { package = "console-core-mermaid-graph", path = "crates/dugong-graphlib", version = "=0.10.0-alpha.2" }
manatee = { package = "console-core-mermaid-cytoscape", path = "crates/manatee", version = "=0.10.0-alpha.2" }
merman-theme-contract = { package = "console-core-mermaid-theme-contract", path = "crates/merman-theme-contract", version = "=0.10.0-alpha.2" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.native-sdk]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "unwind"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.native-distribution]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.native-distribution.build-override]
strip = "none"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
