# The wallpapers, and which one answers what.
#
# A picture is chosen by two things: what part of the day it is, worked out
# from the sun, and what the weather is, asked of a service that wants no
# account. `console-sky` does the choosing and `sky-press` writes the pictures.
#
# The rule for choosing is that the most particular picture wins. A picture
# that names a part of the day and a weather beats one that names only a part
# of the day, which beats one that names nothing. So a picture naming nothing
# is the one that is up when nothing else fits, and a set is grown by adding a
# picture rather than by editing the ones already here.
#
# Pictures that name the same number of true things take turns, two hours
# apiece, in the order they are written down here. That is why most of these
# come in pairs: one picture for a clear day is a picture, and two are a morning
# and an afternoon.
#
# Every picture in this file is by Abi Toads, who gives them away
# (abitoads.com/pages/animated-wallpapers, through Wallpaper Engine on Steam).
# They are fetched rather than kept here: this repository is source, the
# pictures are somebody else's work, and `console apply` presses them on the
# device the way it compiles the programs.
#
# The addresses are mirrors rather than hers. She publishes through Wallpaper
# Engine, which is a Steam program and not a thing this machine can fetch from,
# so each picture is taken from a site that mirrors her workshop item, and each
# one here was matched against the workshop item it came from before it was
# written down. A mirror that moves its addresses breaks the fetch for that one
# picture and says so; a mirror that quietly hands back something else is what
# the checksums are for.

# How the pictures move.
#
# They loop: the artist's whole animation, over and over, for as long as
# nothing is in front of it. A loop that stops is stranger to look at than one
# that does not, and what paid for stopping is now had another way, by not
# moving at all while a window or a menu is over the picture.
#
# `rest_seconds` above zero brings the old behaviour back for one picture: a
# still that holds for that long, then a few seconds of movement, then a snap
# back to the still. It is here because a picture whose every pixel moves costs
# the same whether anybody is looking at it or not, and this is the setting
# that buys that back. `seconds` is how long that movement lasts and is ignored
# by a picture that loops.
#
# Twelve frames a second is the artist's thirty halved and halved again to
# about a third. These are hand-drawn loops of water and firelight, none of
# which has an edge sharp enough to judder at twelve.
[stir]
rest_seconds = 0
seconds = 4.0
frames_per_second = 12
tolerance = 6
quality = 82

# --------------------------------------------------------------- the pictures
#
# `grade` is how far a picture is brought into this palette. `keep` is how much
# of the artist's own colour survives, `pull` is how much of the theme's colour
# is laid over it, and `ceiling` is where the picture's brightest point lands,
# which is what leaves the bar something to be read against. `docs/sky.md` has
# the argument; the numbers here were chosen by looking at a proof sheet.
#
# A green daylight picture takes the pull worst, because a bright green scene in
# a dark plum theme is a contradiction and pulling it hard turns it grey. Those
# keep more of themselves and give up more of their brightness instead.

[[picture]]
name = "terrarium"
says = "Terrarium"
by = "Abi Toads"
from = "https://motionbgs.com/dl/4k/9581/"
sha256 = "5209739feecabc6b6b640fde57ddfc30156849c503bd5ad6e964c1e409af6ced"
grade = { keep = 0.50, pull = 0.50, floor = 0.0, ceiling = 0.72 }
# This one names nothing, so it is what is up when nothing else answers: rain,
# fog and thunder at any hour. A tank of plants indoors is the right picture
# for weather you would rather be inside than out in.

[[picture]]
name = "shelf-of-curiosities"
says = "Shelf of Curiosities"
by = "Abi Toads"
from = "https://www.desktophut.com/files/nQcXBjbpWotOMo9_Shelf%20of%20Curiosities%20-%20Abi%20Toads%204K%20Live%20Wallpaper.mp4"
sha256 = "96d6875213c70d1d2a389ca5a0794054b6f92a50a982ab25e7ee41723e7193b7"
grade = { keep = 0.40, pull = 0.60, floor = 0.0, ceiling = 0.74 }
# The other picture that names nothing, so a wet week is two pictures rather
# than one. A shelf of bottles and books by candlelight is indoors the same way
# the terrarium is, which is the whole argument for both of them.
#
# It is also the dearest picture here by some way. A candle flickering across a
# painted interior moves nearly the whole frame, so the rectangles that make the
# other pictures cheap buy nothing at all, and it presses larger than anything
# else in this file. docs/sky.md says what that costs while it is on the screen.
# If the device ever wants the memory back, this is the line to take out.

