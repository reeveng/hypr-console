[package]
name = "console-input-language"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_input_language"
path = "src/lib.rs"

[[bin]]
name = "switch-language"
path = "src/bin/switch-language.rs"

[dependencies]
# Which alphabets this machine types, what each is called in xkb, and what each
# keyboard was last switched to. The vocabulary is shared with the keyboard
# drawn on the screen, so a switch means the same thing on both.
console-input-alphabets.workspace = true
# What hyprctl is asked and what its answers mean. Nothing here spells a
# hyprctl word.
console-compositor.workspace = true
console-core-never.workspace = true
console-core-places.workspace = true

[lints]
workspace = true
