[package]
name = "console-input-claim"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_input_claim"
path = "src/lib.rs"

[dependencies]
# Which device is the pad and which is the keyboard beside it, and what each
# code coming off them is called. Both are the daemon's rules rather than ones
# of this crate's own: a claim that found a different pad than the daemon reads
# would be a claim over the wrong device, which is the fault it exists to stop.
console-gamepad.workspace = true
console-never.workspace = true
evdev = "0.13"

[lints]
workspace = true
