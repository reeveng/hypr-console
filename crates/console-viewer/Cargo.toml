[package]
name = "console-viewer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_viewer"
path = "src/lib.rs"

[[bin]]
name = "viewer-panel"
path = "src/bin/viewer-panel.rs"

[dependencies]
console-number.workspace = true
console-panel.workspace = true
gtk4 = "0.11"

# The film half. GTK's own `GtkMediaFile` plays nothing here -- GTK is packaged
# with no media backend at all -- so the pipeline is built in this panel and
# ends in gst-plugin-gtk4's sink, which hands back a paintable. Held to the
# release whose glib is gtk4 0.11's, or the paintable that comes back is a
# different Rust type from the one a picture widget takes.
gstreamer = "0.25"

[dev-dependencies]
console-settings.workspace = true

[lints]
workspace = true
