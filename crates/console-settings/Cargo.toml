[package]
name = "console-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_settings"
path = "src/lib.rs"

[[bin]]
name = "settings-panel"
path = "src/bin/settings-panel.rs"

# What /etc says about who this machine belongs to and where it is: the
# language, the hour and the name. Root's three files, run through the one
# rule in /etc/sudoers.d/console that lets the panel reach them.
[[bin]]
name = "console-machine"
path = "src/bin/console-machine.rs"

[[bin]]
name = "console-battery"
path = "src/bin/console-battery.rs"

# Meeting a device: pair, trust and connect, which is one press on a row and
# three words to bluez.
[[bin]]
name = "console-bluetooth"
path = "src/bin/console-bluetooth.rs"

[[bin]]
name = "console-brightness"
path = "src/bin/console-brightness.rs"

[[bin]]
name = "console-volume"
path = "src/bin/console-volume.rs"

[[bin]]
name = "console-warm"
path = "src/bin/console-warm.rs"

[[bin]]
name = "console-scale"
path = "src/bin/console-scale.rs"

[dependencies]
console-applications.workspace = true
console-core-places.workspace = true
console-compositor.workspace = true
console-core-external-programs.workspace = true
console-core-never.workspace = true
console-core-atomic-writes.workspace = true
console-waiting.workspace = true
console-core-number-conversion.workspace = true
console-default-applications.workspace = true
console-home-screen.workspace = true
console-program-contract.workspace = true
console-notifications.workspace = true
console-panel.workspace = true
console-screen.workspace = true
console-wallpaper.workspace = true
console-input-alphabets.workspace = true
# The program that steps a keyboard on to the next alphabet, for its name and
# the word that means settle rather than step. Changing what this machine types
# has to reach a keyboard somebody plugged in as well as the one on the screen.
console-input-language.workspace = true
console-input-dictation.workspace = true
console-core-localization.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
