# So that /dev/uinput is there, and there through an add event.
#
# Nothing on this machine loads uinput by itself: a module is loaded when
# something opens its node, and the node is what the session cannot open. Loaded
# here, at boot, udev sees a device arrive and 94-console-uinput.rules hands it
# to the person logged in -- which a static node never gets, because a static
# node carries a mode and a group and runs no rule.
uinput
