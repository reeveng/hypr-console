[what a call is handed]
# EXPLICIT044 says a function decides from what it was handed and EXPLICIT047
# says the same of a closure, so "hand it in" is the answer this tree gives at
# every site either rule finds. The functions that take a closure and hand it
# nothing each have a second spelling saying so in their name -- a wait, a
# stretch of an apply, the sentence a failed check prints, the line a run draws
# quietly -- and the parameter carries the same word, so a reader meeting
# `until_handed` in one crate has already met it in another.
#
# `arguments` is here for the same reason and was `argv` until it was written
# out: what a program is started with is handed in at `main` and read nowhere
# else, so every program in this tree says the word once at the top and again
# at each call that passes it on.
arguments
handed

