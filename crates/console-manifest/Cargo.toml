[package]
name = "console-manifest"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `console`, because that is what somebody types on the device. The crate is
# named for what it is; the program is named for what it does.
[[bin]]
name = "console"
path = "src/main.rs"

[dependencies]

[dev-dependencies]
serde_json = "1"
serde_yaml_ng = "0.10"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
