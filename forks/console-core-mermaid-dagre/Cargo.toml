[package]
name = "console-core-mermaid-dagre"
version = "0.10.0-alpha.2"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/Latias94/merman"
repository = "https://github.com/Latias94/merman"
rust-version = "1.95"
description = "Dagre-compatible graph layout algorithms (port of dagrejs/dagre)."
documentation = "https://docs.rs/dugong"
keywords = ["graph", "layout", "dagre", "diagrams"]
categories = ["visualization"]

[dependencies]
dugong-graphlib = { package = "console-core-mermaid-graph", path = "../console-core-mermaid-graph", version = "=0.10.0-alpha.2" }
console-core-perfect-hash = { path = "../../crates/console-core-perfect-hash", features = ["std"] }
console-core-point = { path = "../../crates/console-core-point" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
criterion = "=0.8.2"

[[bench]]
name = "network_simplex"
harness = false

[[bench]]
name = "feasible_tree"
harness = false

[[bench]]
name = "layout"
harness = false

[lib]
name = "dugong"
