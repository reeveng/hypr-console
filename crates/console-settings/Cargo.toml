[package]
name = "console-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_settings"
path = "src/lib.rs"

[[bin]]
name = "settings-panel"
path = "src/bin/settings-panel.rs"

[[bin]]
name = "console-battery"
path = "src/bin/console-battery.rs"

[[bin]]
name = "console-brightness"
path = "src/bin/console-brightness.rs"

[[bin]]
name = "console-volume"
path = "src/bin/console-volume.rs"

[[bin]]
name = "console-warm"
path = "src/bin/console-warm.rs"

[[bin]]
name = "console-scale"
path = "src/bin/console-scale.rs"

[dependencies]
console-number.workspace = true
console-defaults.workspace = true
console-home.workspace = true
console-notices.workspace = true
console-panel.workspace = true
console-screen.workspace = true
console-sky.workspace = true
console-voice.workspace = true
console-words.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
