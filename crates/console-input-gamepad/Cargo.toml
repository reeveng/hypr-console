[package]
name = "console-input-gamepad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "capture-devices"
path = "src/bin/capture.rs"

[[bin]]
name = "allow-uinput"
path = "src/bin/allow-uinput.rs"

[[bin]]
name = "console-emulate"
path = "src/bin/emulate.rs"
required-features = ["read"]

# Reading a profile back out of YAML, which nothing on the handheld does.
#
# The device writes profiles -- `router::Router::yaml` composes the one it
# wears -- and reads none: the emulator, the checks and the tests are what read
# them, and all three run on a laptop. Off by default, so `console apply` does
# not build a YAML parser transliterated out of C for a program that never
# calls it. `profile.rs` argues the rest, including why there is no reader of
# our own here instead.
[features]
read = ["dep:serde_yaml_ng"]

[dependencies]
console-core-external-programs.workspace = true
console-core-never.workspace = true
console-program-contract.workspace = true
console-program-runtime.workspace = true
console-repository.workspace = true
console-core-number-conversion.workspace = true
evdev = "0.13"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = { version = "0.10", optional = true }

# This crate, so that its own tests always have the reader. Every test here
# that opens a profile would otherwise need `--all-features` on the command
# line, and a test that only compiles when somebody remembers a flag is a test
# that stops being run.
[dev-dependencies]
console-input-gamepad = { path = ".", features = ["read"] }

[lints]
workspace = true
