[package]
name = "console-core-font-types"
version = "0.12.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The scalar types an OpenType font file is written in, and their big-endian bytes."

[features]
bytemuck = ["dep:bytemuck"]
serde = ["dep:serde"]

[dependencies]
console-core-bytes.workspace = true
console-core-never.workspace = true
console-core-point.workspace = true
console-core-number-conversion = { path = "../console-core-number-conversion", default-features = false }
bytemuck = { version = "1.14.0", features = ["derive", "min_const_generics"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true, default-features = false }

[dev-dependencies]
serde_json = "1.0"

[lints]
workspace = true
