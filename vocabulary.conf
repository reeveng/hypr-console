# The word for each concept, taken from somebody else.
#
# `words.conf` is the list of words this tree invented and kept. This file is
# the other half and the one that decides: for every concept this desktop has,
# the name the rest of the world already uses. A reader who has never opened
# this tree should know what a name means before reading the source, and the
# test of that is whether the word came from somewhere.
#
# Two sources, in this order, and no third. A word on the right is one effect's
# own code writes or one Apple writes; a word neither of them writes has no
# line, however ordinary it is somewhere else, because "somewhere" is the
# lookup this file exists to save.
#
# **effect-ts** for anything structural -- a failure, a result, a subscription,
# a schedule, a scope, a resource, a context. Its checkout is
# `Effect-TS/effect`, and a name on the right of an `=` is one that effect's
# code writes in `packages/effect/src` or in the 3.x line's `cli`, `platform`
# and `experimental` packages -- not one that only a comment there says. The
# tree takes it because it is a large, deliberate vocabulary for exactly the
# problems this tree has -- something that can fail, something that runs
# later, something that needs cleaning up -- and because it argues its names
# rather than abbreviating them.
# Where effect and Rust's standard library disagree, Rust wins inside Rust:
# `Result`, `Option`, `Some`, `None`, `Err` are the words a Rust reader already
# has, and a standard library type is the language's rather than a choice made
# here, so it needs no line.
#
# **Apple** for anything a person reads or says out loud: the words on the
# screen and in the menu. "Do Not Disturb", "Low Power Mode", "Screen Time",
# "Night Shift", "Handoff", "Focus", "Sleep", "Wake". A feature gets the name
# somebody uses telling a friend what it does, which is why the sections at the
# end read as plainly as they do. Where the code draws or reads a controller,
# it takes the names UIKit and GameController give those parts.
#
# A line is `ours = Theirs`. The left is what this tree writes today and the
# right is what it should write; a line with nothing on the left is a name to
# reach for that has no predecessor here. When a name is migrated everywhere,
# its line stays -- this file is the argument for the name, not a list of
# chores, and the next agent that wonders whether `Heard` was better reads the
# line rather than renaming it back.
#
# Where this tree's own rules and a source disagree, this tree wins. effect-ts
# and Apple are where a name is looked up, not an authority over one: the rule
# below is held even at sites effect spells short, because a reader here is
# owed the whole word.
#
# A name speaks in the present and in the active voice. An event takes the
# name of what happens or of what it carries -- `Copy`, `Paste`, `Install`,
# `Flush` -- and never of what already happened, and a state is an adjective or
# a noun -- `Ready`, `Available`, `UpToDate` -- rather than a past participle,
# which says what somebody did to a thing rather than what the thing is. This
# rule is the tree's own and beats both sources where they write `isPressed` or
# `Succeeded`, so a participle still on the right of a line below is a line
# still to rewrite.
#
# No abbreviations, ever. `Arguments` and not `Args`, `Configuration` and not
# `Config` where the word stands alone, `Receiver` and not `Rx`. A shortened
# word is a second word the reader has to expand, and the tokenizer saves
# nothing for it.
#
# What this file does not decide: crate names, which `CLAUDE.md` walks, and
# variant names inside a two-state enum, which read off the concept rather than
# off a list. What it does not contain: a word nobody here writes and nobody
# here needs.

[failure] (effect: Cause, Exit)
# effect splits what went wrong three ways and the split is worth having: a
# `Fail` is the fault the caller was told about and can decide something about,
# a `Die` is a defect nobody declared, and an `Interrupt` is the work being
# stopped from outside. EXPLICIT038 already asks every crate for an enum naming
# its faults; this says what to call it and what the arms mean.
Complaint = ValidationError
Unreadable = ParseError, Read, Parse, Failed, Invalid -- Read where a file could not be read, Parse where it was read and made no sense
Missing = NotFound, Absent
Fault = Error
Wire = ConnectionError
= Defect
= Interrupt
= Cause
Done = Exit, Finished, Succeeded, Halt -- Succeeded beside a Failed, Finished where nothing could fail, Halt where a loop stops beside Again
Never = Never

[what came back] (effect: Exit, Option, Result)
# Rust's own words win here and effect agrees with most of them. What effect
# adds is `Exit`, which is a result that also knows it was interrupted, and
# that is the shape a check run and a deploy both want.
Answered = Success, Response, Reply
Refused = Failure, Rejected, Denied, Failed
Unfound = NotFound
Waited = Outcome
Nothing = None, Absent, Ignored
Something = Some
Empty = Empty

[events] (effect: Stream, PubSub, Queue, Take)
# A thing that produces values over time is a `Stream`, the thing you attach to
# it is a `Subscription`, what arrives is an `Event`, and the verbs are
# `publish`, `subscribe`, `emit` and `receive`. The tree's `Heard`/`Said`/
# `Telling`/`Hearing` family is four words for two of those.
Heard = Received, Audio
GotIn = Connected
Said = Event, Output, Value, Reply, Notification, Settings -- whatever was said, named for what it holds
Says = Message, where it is a line on a wire
Listening = Subscriber
Listen = Subscribe
StopListening = Unsubscribe
= Publish
Saying = Sender
Telling = Sender, or Subscriber where one connection is meant
Wanting = Desired
Changed = Change, Modified, Different -- for the struct; `Event::Changed` is the event and keeps its tense
Topic = EventGroup -- what a program subscribes to: the battery, the sound, a folder

[work that runs later] (effect: Effect, Fiber, Deferred, Latch)
# `Effect` is already the tree's word for what a program wants done and it is
# effect's too, which is the one place this already lined up. The rest of the
# family: a running one is a `Fiber`, a value that will arrive is a `Deferred`,
# a thing many can wait on is a `Latch`.
Effect = Effect
Doing = Action
Does = Effect, Action
Acts = Action
What = Action, Description, Selection, Expected, Describe
Job = Task -- except the kernel's job object, which is a job everywhere
Jobs = Tasks
Carry = Payload
Out = Output, Disconnected, Outside, Expanded
InEffect = Effect

[waiting] (effect: Schedule, Duration, Clock)
# effect's `Schedule` is the whole of "how often and for how long", built from
# `spaced`, `exponential`, `recurs`, `upTo` and `jittered`. `console-core-schedules`
# is that idea under effect's own words, stepped by a `Driver` that answers
# with a `Decision`, and `console-waiting`, `console-core-reconnect` and the
# checks on the handheld all run it. EXPLICIT047 is the argument about
# `until`'s signature -- the name is the easy half.
Patience = Schedule
= Driver
= Decision
Wake = wake
Until = Until
Stale = Stale
Ticks = Interval
= Clock
RecordingClock = TestClock
Woken = Latch, WakeState, Wake -- Latch where a loop waits on it, WakeState or Wake where it says whether something is awake
Settled = UpToDate, Ready, Flush -- UpToDate where the manifest meets the machine, Ready where a surface waits on the compositor, Flush where a writer finishes its queue

[lifetime] (effect: Scope, Resource, Pool)
# Something acquired has to be released, and effect puts both halves in one
# place: a `Scope` holds finalizers and `acquireRelease` is how a thing joins
# one. `console-program-lifetime` asks the same question at every spawn.
LetGo = Detached
PutBack = Restore
Putting = Restore
Kept = Retained, Record -- one name per site, see [what Kept, Asking and Drawn were]
Held = Pressed, Acquired, Variant, Cached, LongPress -- one name per site, see [what Held was]
Keep = Retain
Shut = Close, Closed, Ended
Apart = Split
Stop::Asked = Stop::Requested
= Scope
= Finalizer
= Pool

[command lines] (effect: cli Command, Options, Args, ValidationError; POSIX: operand)
# effect builds a command's parser, its help and its errors out of one
# definition, and `console-core-arguments` is that: a `Command` lists the
# `Flag`s it takes, the `Operands` after them and, where it does one of
# several things, the enum that is its `Subcommand`. What a refused line was
# refused for is effect's `ValidationError`, help asked for among them. A
# flag's value is a value; whether a flag was given at all is its `Presence`.
= Command
= Flag
= Operands
= Subcommand
= Presence

[state machines] (effect: experimental Machine, platform KeyValueStore)
# effect's experimental `Machine` module named every part of a machine and of
# the thread that runs one, and `console-core-state-machine` and
# `console-actor` are written in its words. The left is what the first draft
# of those crates wrote. Inside a machine `handle` is what was `step`, a
# `Request` what was a `Message`, `initialize` what was `initial`, `encode`
# and `decode` what were `save` and `load`, a `KeyValueStore` what was a
# `Store`, `Booted` what was `Running`, an `Actor` what was an `Address`,
# `send` what were `tell` and `ask`, and `offer` and `take_all` what were
# `push` and `drain`. Those are said here rather than written as lines because
# each is also an ordinary word the rest of the tree spends on something else,
# and a line would retire it everywhere.
resume = initialize -- handed the state it had before, which is effect's previousState
Persist = Serializable
Persistent = SerializableMachine
StoreFault = PlatformError
FileStore = KeyValueStore::file_system
supervise = boot
shutdown = Scope::close
MailboxClosed = Closed
= MachineDefect

[what a call is handed] (effect: Context, Layer, Config, Reference)
# effect's `Context` is the set of services a piece of work needs and `Layer`
# is how one gets built. EXPLICIT044 is the same argument arrived at from the
# other side: what a function needs to run is an input.
When = Context
Conf = Configuration
Spec = Configuration
Declaration = Configuration
Meta = Metadata
Handed = Provided
Arguments = Arguments
Asked = Arguments, Request, Query, Command -- whichever it is at that site

[input] (Apple: UIKit, GameController)
# UIKit and GameController name every one of these already, and a controller
# is not different enough to earn new words.
Pressed = Pressed
Unpressed = Released
Finger = Touch
Reach = Reachability
Bind = Binding -- the hyprctl keyword `bind` stays itself
Trigger = Trigger
Stick = Thumbstick
Applicability = Availability

[drawing] (Apple: frame, bounds, origin, size, render)
# Apple's geometry words are the ones every toolkit borrowed: a view has a
# `frame` and `bounds`, a rect has an `origin` and a `size`. `Corner` holds all
# four and is named after one of them.
Corner = Frame
Words = Text, Strings, Entries
Across = x, buttons, width
Down = y, pressed, pressed_buttons, button_down, failing -- y only where it is a place; a button that is down is pressed
Wide = width
Tall = height
Screenful = Viewport
Painted = Rendered
Drew = Rendered
Undrawn = Hidden
Drawn = Visible, Bitmap
Strip = TabBar
Shape = Shape
Panel = Panel
Inset = Inset
Margin = Margin
Laid = Layout, Install -- Layout where it places things on a screen, Install where an apply puts a file in place
HexColor = Ansi, DrawingContext, Color -- Ansi where it holds a terminal's escapes, DrawingContext where it is what a key paints with; a string that really holds `#rrggbb` keeps the name, which macOS's color picker writes too

[the compositor]
# The tree speaks hyprctl's own words to it as they are and gives them no line
# here; what it must not do is translate them into its own. These are the
# words for asking it and for what comes back.
Layer = Layer
Window = Window
Asked = Query, Request, Requested, Confirm
Asking = Query, Prompt
Told = Request, Outcome, Notice, Audience, Known, Logged, Reply -- Request where it is a request hyprctl runs
Eval = Script -- the lua hyprctl eval runs; eval stays only as the word hyprctl is sent
Taken = Success, Claimed, Busy, Acquired
Answer = Answer
In = Connected -- except D-Bus's own in and out

[what Held was]
# One word was doing twenty jobs. Each of these is what that crate's `Held`
# actually held, and the list is here so nobody reaches for the word again.
console-core-atomic-writes = Stored
console-manifest-engine/previous = Snapshot
console-input-alphabets = Orientation
console-launcher = Cache
console-panel/pictures = Cache
console-downloads, console-music = Actor
console-media-viewer, console-calendar = Shared

[what Kept, Asking and Drawn were]
# The same story as `Held`, three more times.
console-notifications/reading = Inbox
console-music-player/remembering = Bookmark
console-launcher (Kept) = Shared
console-panel/picker (Asking) = Stopwatch
console-input-controller/profile (Asking) = Attempt
console-device/deploying (Asking) = Confirmation
console-events/listening (Asking) = Requested
console-resume/session (Asking) = Dispatch
console-resume/starting (Asking) = Describe
console-panel/panel (Drawn) = Layout
console-status-bar/showing (Drawn) = Rendered
console-compositor (Drawn) = Visible

[programs] (effect: Command, PlatformError)
# When somebody else already holds a name on the bus the answer is `Exists`,
# which is effect's word for the same refusal. The manifest writes a file it
# then leaves alone once, which is what the word after its path says.
Taken = Exists
theirs = once

[places] (Apple: user domain, Application Support)
# A base directory belongs to a user, and the folder this desktop keeps under
# it belongs to the application: Apple's user domain and Application Support,
# and the split every XDG library draws between the base and the project
# directory under it. Nobody reading a path knows whose "hers" and "ours" are.
hers = user
ours = application
OURS = APPLICATION
ours_under = application_under
runtime_ours = application_runtime

[abbreviations]
# Every one of these is the same rule stated at a site: write the word out.
# `console-core-words` keeps its `Words` derive, because that is the crate's own
# name and the thing really is a list of words.
Addr = Address
Arg = Argument
Msg = Message
Conf = Configuration
Config = Configuration
Spec = Configuration
Meta = Metadata
Lc = Contrast
Rect = Rectangle
Init = Initial
Args = Arguments

[the words inside a name] (walking)
# The lines above retired this tree's words for types. These are the words it
# writes inside the name of a field, a function and a local, which is where
# most of them still are: `said` is a file's contents in one place, a program's
# output in the next and a serialized value in a third, and the reader is left
# to work out which from the line it came off. Each word goes to the one the
# rest of the industry writes for what the site holds, and where a word did
# several jobs the options are listed and the site picks the one it is.
said = contents, output, text, reply -- contents where a file was read, output where a program ran, text where a value was serialized, reply where something answered
says = label, text -- label where a row or button shows it
held = contents, state, guard, value -- guard where it is a lock's
holding = state, directory, guard
asked = request, query, arguments, command
asking = query, command, prompt
told = reply, notice, request
heard = received, event, reply
saying = sender, message
kept = cached, stored, retained
room = size, bounds
wide = width
tall = height
far = progress
many = count
took = elapsed, duration
whole = total
wearing = theme
wears = theme, colors
spent = palette -- the palette as it was read, a name to a color
going = progress, running, state
went = outcome, result
standing = state, current
aside = detail -- Apple's detail text, the second line of a row
beside = sibling -- a path in the same directory
lit = highlighted
stirs = on_wake
lands = target -- what a tap is on
stamp = metadata, timestamp -- metadata where it is freedesktop's Thumb::URI and Thumb::MTime
carried = payload
shown = visible
gone = removed, closed, dismissed
whose = owner
ours = own, internal

[what a person reads] (Apple)
# The words on the screen and in a menu. Said the way somebody would say it to
# a friend, never the way the code spells it.
Quiet = Do Not Disturb
Warmth = Night Shift
Dimmed = Brightness
Awake = Wake, Unlocked
Asleep = Sleep
Hurry = Low Power Mode
Wallpaper = Wallpaper
Home = Home Screen
Put Away = Eject
Backoff = High Power Mode
PickedUp = Copy
PutDown = Paste
