# The name is what an earlier hand wrote at this path, and it is kept so an
# apply writes over that file rather than beside it: an apply removes nothing,
# and a second name would leave the first one's wait in force under it.
#
# That wait was `ExecStartPre=/bin/sleep 8`, laid down by hand on the day
# InputPlumber 0.78 was installed. The controller comes up twice at every boot
# and at every attach -- as 17ef:61eb, then about three seconds later as
# 17ef:61ed once its firmware has switched modes -- and 0.78 grabbed the first
# and settled having claimed only the gyro. 0.81 follows the switch: at an
# attach it logs "Found missing input device" and takes every node back into
# the composite device it already had. The eight seconds were eight seconds of
# a login window whose pad did nothing, on every boot.
#
# What stays is the recovery, which costs nothing when it is not needed.
# `console-check boot` asks whether the pad was claimed whole, which is the
# answer the wait was standing in for.
[Unit]
After=systemd-udevd.service
Wants=systemd-udevd.service

[Service]
Restart=on-failure
RestartSec=3
