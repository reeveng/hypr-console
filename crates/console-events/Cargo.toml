[package]
name = "console-events"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_events"
path = "src/lib.rs"

[[bin]]
name = "console-events"
path = "src/bin/console-events.rs"

[dependencies]
console-actor.workspace = true
console-compositor.workspace = true
console-concurrency.workspace = true
console-core-arguments.workspace = true
console-core-bounded-reads.workspace = true
console-core-state-machine.workspace = true
console-operating-system-linux.workspace = true
console-bluetooth.workspace = true
console-bus.workspace = true
console-program-contract.workspace = true
console-core-never.workspace = true
console-core-iteration.workspace = true
console-core-directory-listing.workspace = true
console-core-logging = { workspace = true, features = ["std"] }
console-onscreen.workspace = true
console-core-reconnect.workspace = true
console-core-text-encodings.workspace = true
console-core-external-programs.workspace = true
console-program-lifetime.workspace = true
console-core-number-conversion.workspace = true
rustix.workspace = true
console-waiting.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Waiting for the pool to come up rather than for a number of milliseconds.
console-waiting.workspace = true
console-core-temporary-directories.workspace = true
criterion.workspace = true

[[bench]]
name = "ipc"
harness = false

[lints]
workspace = true
