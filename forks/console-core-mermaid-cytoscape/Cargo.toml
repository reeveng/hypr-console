[package]
name = "console-core-mermaid-cytoscape"
version = "0.10.0-alpha.2"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "AGPL-3.0-or-later"
homepage = "https://github.com/Latias94/merman"
repository = "https://github.com/Latias94/merman"
rust-version = "1.95"
description = "Headless compound graph layout algorithms (COSE/FCoSE ports)."
documentation = "https://docs.rs/manatee"
keywords = ["graph", "layout", "cose", "fcose"]
categories = ["visualization"]

[dependencies]
indexmap = "2.14.2"
libm = { version = "=0.2.16", default-features = false }
thiserror = "2.0.21"
console-core-perfect-hash = { path = "../../crates/console-core-perfect-hash", features = ["std"] }
console-core-point = { path = "../../crates/console-core-point" }

[lib]
name = "manatee"
