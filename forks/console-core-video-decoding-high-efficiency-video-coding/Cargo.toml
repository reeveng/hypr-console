[package]
name = "console-core-video-decoding-high-efficiency-video-coding"
description = "Clean-room pure-Rust H.265/HEVC decoder (ITU-T H.265)"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.95"
repository = "https://github.com/storytold/filmcraft"

[lib]
name = "console_core_video_decoding_high_efficiency_video_coding"
path = "src/lib.rs"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
console-core-video-decoding-bitstream = { path = "../console-core-video-decoding-bitstream" }
thiserror = "2"
rayon = { version = "1", optional = true }

[lints.rust]
warnings = "allow"
