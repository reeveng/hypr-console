# The confinement in console-.service.d/confining.conf, taken back off.
#
# Putting the windows back means starting the programs that were in them, which
# is the same problem the bar has: what this unit starts is a person's choice
# from the last session, and it starts it in this unit's own context. A
# sandbox here would be a sandbox on everything that was open yesterday, laid
# on quietly at every login.
#
# The argument is in `confining.conf`, and so is what would have to change
# first.

[Service]
NoNewPrivileges=no
ProtectSystem=no
PrivateTmp=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectControlGroups=no
RestrictSUIDSGID=no
RestrictRealtime=no
RestrictNamespaces=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
