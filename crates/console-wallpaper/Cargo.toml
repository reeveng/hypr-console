[package]
name = "console-wallpaper"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "console_wallpaper"
path = "src/lib.rs"

[[bin]]
name = "console-wallpaper"
path = "src/bin/console-wallpaper.rs"

[[bin]]
name = "wallpaper-render"
path = "src/bin/wallpaper-render.rs"

[dependencies]
console-core-internal-programs.workspace = true
console-core-arguments.workspace = true
console-core-atomic-writes.workspace = true
console-core-size.workspace = true
console-core-never.workspace = true
console-core-logging = { workspace = true, features = ["std"] }
console-core-places.workspace = true
console-repository.workspace = true
console-core-external-programs.workspace = true
console-core-iteration.workspace = true
console-core-number-conversion.workspace = true
console-core-words.workspace = true
console-operating-system-linux.workspace = true
console-program-contract.workspace = true
console-compositor.workspace = true
console-onscreen.workspace = true
console-core-color.workspace = true
console-screen.workspace = true
console-weather.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console-core-checksums.workspace = true
toml = { version = "1", default-features = false, features = ["parse", "serde", "preserve_order", "display"] }
console-core-state-machine.workspace = true

[lints]
workspace = true

[dev-dependencies]
console-program-runtime.workspace = true
console-core-temporary-directories.workspace = true
