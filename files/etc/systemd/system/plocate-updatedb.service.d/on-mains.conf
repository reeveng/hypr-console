# The index `locate` reads, rebuilt daily by walking the whole disk: about
# thirty seconds of the handheld's processors and its drive, on battery as
# readily as on the charger. man-db's daily rebuild beside it already says
# ConditionACPower=true in its own package; this says the same of plocate, so
# the walk waits for a day the timer fires with the machine plugged in. A day
# on battery is a day the index is a day older, which nothing here reads.
[Unit]
ConditionACPower=true
