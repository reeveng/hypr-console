[package]
name = "console-palette"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "console-palette"
path = "src/main.rs"

[dependencies]
console-core-atomic-writes.workspace = true
console-core-words.workspace = true
console-repository.workspace = true
console-core-color.workspace = true
console-core-never.workspace = true
console-core-number-conversion.workspace = true
console-core-places.workspace = true
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "preserve_order"] }

[lints]
workspace = true
