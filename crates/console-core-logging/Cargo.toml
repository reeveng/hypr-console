[package]
name = "console-core-logging"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Library diagnostics with a process-wide output chosen by the host."

[features]
std = [
  "dep:console-core-atomic-writes",
  "dep:console-core-checksums",
  "dep:console-core-places",
  "dep:rustix",
  "dep:serde_json",
  "dep:url",
]

[dependencies]
console-core-never.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
console-core-atomic-writes = { workspace = true, optional = true }
console-core-checksums = { workspace = true, optional = true }
console-core-places = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2.5", optional = true }

[lints]
workspace = true
