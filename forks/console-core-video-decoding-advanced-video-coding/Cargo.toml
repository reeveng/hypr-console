[package]
name = "console-core-video-decoding-advanced-video-coding"
description = "Clean-room pure-Rust H.264/AVC decoder (ITU-T H.264)"
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.95"
repository = "https://github.com/storytold/filmcraft"

[lib]
name = "console_core_video_decoding_advanced_video_coding"
path = "src/lib.rs"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
console-core-adaptive-arithmetic-decoding = { path = "../../crates/console-core-adaptive-arithmetic-decoding" }
console-core-video-decoding-bitstream = { path = "../console-core-video-decoding-bitstream" }
thiserror = "2"
rayon = { version = "1", optional = true }

[lints.rust]
warnings = "allow"
